<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The admin area must never show up in search results. (The real protection is the sign-in on
       the server; this only keeps it out of Google.) -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Safari Ember · Admin</title>
  <link rel="icon" href="mark.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Playfair for headings (as on the site), Source Sans 3 for everything you read (names, emails,
       dates, notes), Jost for figures, capital labels and buttons (as on the site) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       SAFARI EMBER ADMIN · DESIGN PROTOTYPE
       The lodge's back office: the same warm black and ember as the site, but calmer and denser,
       because staff scan it all day. Plain sans-serif for data, serif only for page titles,
       no decorative motion, and every colour checked for contrast.

       Everything below runs on SAMPLE DATA (the DATA block in the script). When the API exists
       (Phase 5), the screens stay the same and only the data source changes.
    ========================================================================== */
    :root {
      /* Surfaces, darkest to lightest */
      --bg:        #0b0907;
      --panel:     #13100c;
      --panel-2:   #1a150f;
      --panel-3:   #241c14;
      --line:      rgba(200, 120, 42, .16);
      --line-2:    rgba(200, 120, 42, .32);

      /* Text. Secondary text is a light sand, not brown (Oct 2026 readability pass): the old
         tones passed the 4.5:1 minimum but tired the eyes over a day at the desk.
         On --panel: text 15:1, muted 11.9:1, dim 9.7:1. */
      --text:      #f5e8d0;
      --muted:     #dccbaf;
      --dim:       #cbb79b;

      /* Brand */
      --ember:     #c8782a;
      --ember-hi:  #e8954a;

      /* Fields: the site's sand */
      --field:     #dcd2c3;
      --field-ink: #1c1610;
      /* The same sand, used in the admin for DATA: dark ink on sand, like paper on a desk.
         Today's Arriving and Leaving sheets, the Bookings list, a booking's details and
         today's calendar column. Alerts (holds, enquiries, a guest's request) are
         NOT sand: they're dark with an ember edge and an ember headline label. */
      --sand-ember: #8a3f0e;   /* ember text on sand: 5.0:1 (AA) */
      --sand-muted: #47372a;   /* secondary text on sand: 7.6:1 */

      /* Places you type: near-white with a visible edge, so they can never be mistaken for the
         sand sheets of read-only data around them */
      --input:      #fbf7f0;
      --input-edge: #8c7a63;

      /* Status colours. Never colour alone: every status also has a word. */
      --st-held:      #f0b070;  --st-held-bg:      rgba(232, 149, 74, .14);
      --st-ok:        #9fd3a0;  --st-ok-bg:        rgba(120, 190, 120, .13);
      --st-inhouse:   #9cc8ea;  --st-inhouse-bg:   rgba(120, 170, 220, .13);
      --st-done:      #c2b5a5;  --st-done-bg:      rgba(255, 255, 255, .06);
      --st-bad:       #f0a090;  --st-bad-bg:       rgba(220, 90, 70, .14);

      --serif: 'Playfair Display', Georgia, serif;
      /* Three faces, three jobs (Oct 2026):
           --serif   Playfair Display: page titles and headings, the brand's flair
           --sans    Source Sans 3: all data you read (names, emails, dates, notes, fields). Its
                     open, distinct letters read faster than Jost's geometric ones at 13–15px
           --figure  Jost: numbers that stand on their own, the small capital labels and buttons,
                     tying the admin to the site's headline tags (see the end of this stylesheet) */
      --sans:   'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --figure: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;

      --radius: 0;   /* square corners throughout, like the public site */
      --side-w: 232px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--ember-hi); }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 400; }
    /* One clear focus ring everywhere, for keyboard users */
    :focus-visible { outline: 2px solid var(--ember-hi); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .num { font-variant-numeric: tabular-nums; }     /* figures line up in columns */

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 0 16px; border-radius: 0;
      border: 1px solid var(--line-2); background: transparent; color: var(--text);
      font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .btn:hover { border-color: var(--ember); background: var(--panel-2); }
    .btn--primary { background: var(--ember); border-color: var(--ember); color: #120c06; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; padding: 0 22px; }
    .btn--primary:hover { background: var(--ember-hi); border-color: var(--ember-hi); }
    .btn--danger { border-color: rgba(240, 160, 144, .45); color: var(--st-bad); }
    .btn--danger:hover { background: var(--st-bad-bg); border-color: var(--st-bad); }
    .btn--small { min-height: 32px; padding: 0 12px; font-size: 13px; }
    .btn--ghost { border-color: transparent; color: var(--muted); }
    /* Capitals like the site's buttons, done in CSS so screen readers still read words, not letters */
    .btn--caps { text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 600; padding: 0 20px; }
    .btn--ghost:hover { color: var(--text); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    /* The sign-in buttons: capitals like the other main buttons, but Jost Medium, not semibold */
    .btn--primary.btn--plain { font-weight: 500; }
    /* A Save with nothing to save: an outline, not a faded orange block */
    .btn--primary[disabled] { opacity: 1; background: transparent; border-color: var(--line-2); color: var(--dim); }

    /* ── Status chips ─────────────────────────────────────────────────────── */
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 0;
            font-size: 12.5px; font-weight: 500; white-space: nowrap; }
    .chip::before { content: ''; width: 6px; height: 6px; border-radius: 0; background: currentColor; }
    .chip--HELD      { color: var(--st-held);    background: var(--st-held-bg); }
    .chip--CONFIRMED { color: var(--st-ok);      background: var(--st-ok-bg); }
    .chip--INHOUSE   { color: var(--st-inhouse); background: var(--st-inhouse-bg); }
    .chip--COMPLETED { color: var(--st-done);    background: var(--st-done-bg); }
    .chip--EXPIRED   { color: var(--st-done);    background: var(--st-done-bg); }
    .chip--CANCELLED { color: var(--st-bad);     background: var(--st-bad-bg); }
    .chip--NEW       { color: var(--st-held);    background: var(--st-held-bg); }
    .chip--HANDLED   { color: var(--st-done);    background: var(--st-done-bg); }

    /* ── Forms ────────────────────────────────────────────────────────────── */
    .field { display: grid; gap: 6px; }
    .field label, .label { font-size: 13px; color: var(--muted); font-weight: 500; }
    /* Fields: the site's sand with dark text (as on Get in Touch and the booking page), so the
       places you type stand out from the dark panels. color-scheme: light gives date pickers and
       dropdowns their light versions to match. */
    .input, select.input, textarea.input {
      width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 0;
      background: var(--input); border: 1px solid var(--input-edge); color: var(--field-ink); color-scheme: light;
      transition: border-color .15s, box-shadow .15s;
    }
    .input:hover:not([readonly]) { border-color: var(--field-ink); }
    .input::placeholder { color: #5e4a38; opacity: 1; }            /* 5.6:1 on the sand */
    .input:focus { border-color: var(--ember); outline: none; box-shadow: 0 0 0 3px rgba(200, 120, 42, .45); }   /* an ember ring: where you're typing */
    .input[readonly] { background: transparent; border-style: dashed; color: inherit; }   /* read-only (the demo account): clearly not a field */
    select.input option { background: #fffaf2; color: var(--field-ink); }
    /* Browser autofill paints its own colour: keep the sand and the dark text */
    .input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px var(--input) inset; -webkit-text-fill-color: var(--field-ink); caret-color: var(--field-ink); }
    .hint { font-size: 13px; color: var(--dim); }

    /* ==========================================================================
       SIGN-IN (before the app shell)
    ========================================================================== */
    .auth { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    .auth__card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 0; padding: 36px 32px; }
    .auth__brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; text-align: center; }
    .auth__brand img { width: 64px; height: 64px; }
    .auth__brand h1 { font-family: var(--serif); font-size: 22px; text-transform: uppercase; letter-spacing: .18em; color: var(--ember); }
    .auth__brand p { margin: 0; color: var(--muted); font-size: 14px; }
    .auth form { display: grid; gap: 18px; }
    .code-input { letter-spacing: .5em; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
    .auth__foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--dim); }
    .auth__foot button { background: none; border: 0; color: var(--ember-hi); cursor: pointer; text-decoration: underline; padding: 4px; }

    /* ==========================================================================
       APP SHELL: sidebar + main. On phones the sidebar becomes a drawer.
    ========================================================================== */
    .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; }
    .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
            background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; }
    .side__brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; text-decoration: none; color: var(--text); }
    .side__brand img { width: 34px; height: 34px; }
    /* The logo's name, in the logo's own orange. At 400 the strokes were so thin they blended into
       the dark and read brown; 600 lets the full colour through. */
    .side__brand b { display: block; font-family: var(--serif); font-weight: 600; font-size: 15px; line-height: 1.1;
                     text-transform: uppercase; letter-spacing: .14em; color: var(--ember); }
    .side__brand small { color: var(--dim); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    .nav { display: grid; gap: 2px; }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 0;
             color: var(--muted); text-decoration: none; font-weight: 500; }
    .nav a:hover { background: var(--panel-2); color: var(--text); }
    .nav a[aria-current="page"] { background: var(--panel-3); color: var(--text); box-shadow: inset 2px 0 0 var(--ember); }
    .nav svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    /* A round count, like every other notification. 22px circle for 1-2 digits; wider numbers stretch to a pill */
    .nav .count { margin-left: auto; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px;
                  border-radius: 11px; background: var(--ember); color: #120c06; font-size: 12px; font-weight: 600; line-height: 1; }
    .side__foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 8px 0; display: grid; gap: 10px; }
    .who { display: flex; align-items: center; gap: 10px; }
    .who__avatar { width: 32px; height: 32px; border-radius: 0; background: var(--panel-3); display: grid; place-items: center;
                   color: var(--ember-hi); font-weight: 600; font-size: 13px; }
    .who b { display: block; font-weight: 500; font-size: 14px; }
    .who small { color: var(--dim); font-size: 12.5px; }
    /* Sign out: the site's ghost button (Explore Resort), small: ember capitals in a thin ember
       outline across the sidebar foot, kept low (32px); the outline and text brighten on hover */
    .side__signout { width: 100%; min-height: 32px; padding: 0 12px; background: transparent; border: 1px solid rgba(200, 120, 42, .45); color: var(--ember-hi);
      font-family: var(--figure); font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; }
    .side__signout:hover { background: transparent; border-color: var(--ember); color: var(--text); }
    .proto-note { font-size: 12px; color: var(--dim); line-height: 1.4; }
    /* Live data (Phase 5): loading, a failed load, the demo account's note, sign-in errors */
    .loading { color: var(--muted); padding: 40px 0; }
    .problem { background: var(--panel-2); border-left: 3px solid var(--st-bad); padding: 16px 18px; max-width: 640px; }
    .problem p { margin: 0 0 12px; }
    .demo-note { font-size: 12.5px; color: var(--muted); line-height: 1.45; border-left: 2px solid var(--ember); padding-left: 10px; }
    .auth__error { margin: 0; color: var(--st-bad); font-size: 14px; }

    .main { min-width: 0; }
    .topbar { display: none; }
    .page { padding: 32px 36px 64px; max-width: 1240px; }
    .page__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .page__title { font-family: var(--serif); font-size: 30px; line-height: 1.15; }
    .page__sub { margin: 6px 0 0; color: var(--muted); }

    /* ── Panels and lists ─────────────────────────────────────────────────── */
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel__head h2 { font-family: var(--sans); font-size: 14px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ember-hi); }   /* the site's headline tag */
    .panel__head .hint { margin: 0; }
    .panel__body { padding: 18px; }
    .empty { padding: 22px 18px; color: var(--dim); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .stack { display: grid; gap: 20px; }

    /* Today (option A): the day's numbers on one line, notifications, then the two lists on sand.
       No boxes: spacing and thin rules do the separating, so the names and buttons stand out. */
    /* Today: big, readable from across the reception desk */
    .page__head--today .page__title { font-size: 46px; }
    .page__head--today .page__sub { font-size: 21px; color: var(--text); margin-top: 8px; }
    /* The day's numbers: four equal tiles in one band, split by thin rules, the same width as
       the two lists below, so the page reads as one grid rather than big numbers floating over
       empty space. */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 24px;
      background: var(--panel); border: 1px solid var(--line); }
    .stat { display: grid; gap: 8px; align-content: end; padding: 20px 22px; color: inherit; text-decoration: none; }
    .stat + .stat { border-left: 1px solid var(--line); }
    a.stat:hover { background: var(--panel-2); }
    /* Numbers (Oct 2026): every figure in the admin is Jost semibold, the face the Money tiles
       introduced. Serif stays for page titles and names; a number is data, so it gets the data
       face. Big standalone figures keep proportional digits (tabular only in columns). */
    .stat__n { font-family: var(--sans); font-weight: 600; font-size: 40px; line-height: 1; color: var(--text); }
    .stat__n small { font-size: 20px; font-weight: 500; color: var(--muted); }
    .stat__n .stat__also { display: inline-block; white-space: nowrap; margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--line-2); }   /* a rule, not a dot, between rooms and guests */
    /* The site's headline tag: small capitals, wide letter-spacing, ember */
    .stat__k { font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    a.stat:hover .stat__k { color: var(--ember-hi); }
    /* Notifications (holds, enquiries): an ember circle with the count and the site's headline
       tag beside it. Not sand: sand is for sheets of information; these are alerts. The circle is
       the one round shape on purpose, because a round count reads as "new" everywhere. */
    .notes { display: flex; flex-wrap: wrap; gap: 12px 40px; margin-bottom: 24px; }
    .notice { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .notice__n { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%;   /* half the old size (Oct 2026): a nudge, not a headline */
      background: var(--ember); color: #120c06; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
    .notice__k { display: block; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ember-hi); }
        .notice:hover .notice__k { color: var(--text); }
    .grid-2--wide { gap: 24px; align-items: stretch; }   /* Arriving and Leaving always the same height, side by side */
    /* Arriving and Leaving on sand, like paper on the desk: dark ink, maximum contrast (12:1) */
    .sheet { background: var(--field); color: var(--field-ink); padding: 18px 22px 8px; border-left: 3px solid var(--ember); }
    .list__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .list__head h2 { font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #522b0a; }
    .sheet .hint { color: var(--sand-muted); font-size: 14px; }
    .sheet .rows { border: 0; }
    .sheet .row { padding: 14px 0; border-top: 1px solid rgba(28, 22, 16, .16); }
    .sheet .row__name { font-size: 17px; }
    .sheet .row__name a { color: var(--field-ink); }
    .sheet .row__name a:hover { color: var(--sand-ember); }
    .sheet .row__meta { font-size: 15px; color: var(--sand-muted); }
    .sheet .empty { color: var(--sand-muted); padding: 14px 0 18px; }
    .row__note { font-size: 14px; color: var(--sand-ember); margin-top: 3px; font-weight: 500; }
    .row.is-done .row__name a { color: #5c4c3d; text-decoration: line-through; text-decoration-color: rgba(28, 22, 16, .45); }
    .done-mark { color: #24592c; font-size: 15px; font-weight: 600; white-space: nowrap; }

    /* A row in a "today" list: who, what, action */
    .rows { list-style: none; margin: 0; padding: 0; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row__name { font-weight: 500; }
    .row__name a { color: var(--text); text-decoration: none; }
    .row__name a:hover { color: var(--ember-hi); text-decoration: underline; }
    .row__meta { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .row__actions { display: flex; gap: 8px; align-items: center; }
    .timer { font-variant-numeric: tabular-nums; color: var(--st-held); font-weight: 500; font-size: 14px; }

    /* ── Tables ───────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    caption { text-align: left; }
    th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; padding-top: 16px; padding-bottom: 12px; }
    td { font-size: 14.5px; }
    td.right, th.right { text-align: right; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.clickable { cursor: pointer; }
    tbody tr.clickable:hover { background: var(--panel-2); }
    .ref { font-variant-numeric: tabular-nums; letter-spacing: .03em; font-weight: 500; white-space: nowrap; }   /* SE-XXXXXX never splits */
    td a.ref { color: var(--text); text-decoration: none; }
    td a.ref:hover { color: var(--ember-hi); text-decoration: underline; }
    .sub { display: block; font-size: 13px; color: var(--dim); }
    /* Several room types in one booking: one per line, a hairline between, so they scan as a list */
    .room-list { list-style: none; margin: 0; padding: 0; }
    .room-list li { padding: 3px 0; }
    .room-list li + li { border-top: 1px dashed rgba(28, 22, 16, .22); }
    .table-wrap--sand .sub.owed { color: var(--sand-ember); font-weight: 600; margin-top: 4px; }   /* "Refund due" under the status */

    /* The bookings list on sand, like the Today sheets: dark ink on paper for reading data.
       (The filters bar above stays on the dark panel: its fields are sand already.) */
    .table-wrap--sand { background: var(--field); color: var(--field-ink); }
    .table-wrap--sand th { color: #522b0a; font-weight: 600; border-bottom: 1px solid rgba(28, 22, 16, .28); }
    .table-wrap--sand td { border-bottom: 1px solid rgba(28, 22, 16, .2); }   /* a visible line under every row: the eye can follow it across */
    /* What staff look for first, a little heavier: reference, guest, total */
    .table-wrap--sand td.c-ref .ref, .table-wrap--sand td.c-guest, .table-wrap--sand td.c-money { font-weight: 600; }
    .table-wrap--sand td .sub { font-weight: 400; margin-top: 2px; }
    .table-wrap--sand tbody tr.clickable:hover { background: rgba(28, 22, 16, .06); }
    .table-wrap--sand td a.ref { color: var(--field-ink); }
    .table-wrap--sand td a.ref:hover { color: var(--sand-ember); }
    .table-wrap--sand .sub, .table-wrap--sand .empty { color: var(--sand-muted); }
    /* Status words on sand: no dot, darker colours made for the light background (all 4.6:1 or more) */
    .table-wrap--sand .chip, .panel--sand .chip, .sheet .chip { font-weight: 600; padding: 3px 10px; }
    .table-wrap--sand .chip::before, .panel--sand .chip::before, .sheet .chip::before { display: none; }
    .table-wrap--sand .chip--CONFIRMED, .panel--sand .chip--CONFIRMED { color: #1b5023; background: rgba(36, 120, 50, .16); }
    .table-wrap--sand .chip--HELD, .panel--sand .chip--HELD, .sheet .chip--HELD { color: #7a3a0c; background: rgba(200, 120, 42, .22); }
    .table-wrap--sand .chip--INHOUSE, .panel--sand .chip--INHOUSE, .sheet .chip--INHOUSE { color: #1d4a72; background: rgba(40, 100, 160, .16); }
    .table-wrap--sand .chip--COMPLETED, .table-wrap--sand .chip--EXPIRED, .panel--sand .chip--COMPLETED, .panel--sand .chip--EXPIRED { color: #4f4135; background: rgba(28, 22, 16, .08); }
    .panel--sand .chip--NEW { color: #7a3a0c; background: rgba(200, 120, 42, .22); }
    .panel--sand .chip--HANDLED { color: #4f4135; background: rgba(28, 22, 16, .08); }
    /* Buttons on sand: dark ink outlines (the dark-page ones have cream text) */
    .panel--sand .btn:not(.btn--primary) { color: var(--field-ink); border-color: rgba(28, 22, 16, .35); background: transparent; }
    .panel--sand .btn:not(.btn--primary):hover { background: rgba(28, 22, 16, .07); border-color: rgba(28, 22, 16, .6); }
    /* .btn.btn--x matches the rule above's strength (0,3,0) and comes later, so it wins: no !important */
    .panel--sand .btn.btn--danger { color: #8a2418; border-color: rgba(138, 36, 24, .5); }
    .panel--sand .btn.btn--danger:hover { background: rgba(190, 60, 40, .12); border-color: #8a2418; }
    .panel--sand .btn.btn--ghost { border-color: transparent; color: var(--sand-muted); }
    .panel--sand .btn.btn--primary { color: #120c06; }   /* a link styled as a button (Reply) must not take the sand link colour */
    .table-wrap--sand .chip--CANCELLED, .panel--sand .chip--CANCELLED { color: #8a2418; background: rgba(190, 60, 40, .15); }

    /* Filters bar above the bookings table */
    .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .filters .input { width: auto; min-height: 38px; }
    .filters .search { flex: 1 1 240px; }
    /* Bookings: status as tabs across the top of the panel (option A, Oct 2026), capitals like the
       site's headline tags. On a phone they slide sideways instead of wrapping. */
    .tabs { display: flex; gap: 30px; padding: 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 16px 0 14px;
      font: inherit; font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tabs button:hover { color: var(--text); }
    .tabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--ember); }
    .tabs button:focus-visible { outline-offset: -2px; }

    /* ── Booking detail ───────────────────────────────────────────────────── */
    .detail { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
    /* One booking: the same rules as Today and Bookings. A big top; data on sand with headline
       tags; the guest's request as a notification; the balance due as the one thing that shouts. */
    .page__head--big .page__title { font-size: 46px; }
    .page__head--big .page__sub { display: flex; align-items: center; gap: 14px; font-size: 19px; color: var(--text); margin-top: 8px; }
    /* The sentence under a title that explains the screen: helpful once, not data, so it steps
       back — smaller and in the secondary colour, with room for the title above it */
    .page__head--big .page__sub.page__note { display: block; font-size: 15px; color: var(--muted); margin-top: 10px; max-width: 760px; line-height: 1.5; }
    .page__head--big .chip { font-size: 14px; font-weight: 600; padding: 4px 12px; }
    .page__head--big .chip::before { display: none; }
    .request { background: var(--panel-2); border-left: 3px solid var(--ember); padding: 14px 18px; margin: 0 0 20px; }
    .request__k { display: block; font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ember-hi); }
    .request p { margin: 6px 0 0; font-size: 17px; color: var(--text); }
    .request .btn { margin-top: 14px; }
    .panel--sand { background: var(--field); color: var(--field-ink); border: 0; border-left: 3px solid var(--ember); }
    .panel--sand .panel__head { border-bottom: 1px solid rgba(28, 22, 16, .2); padding: 16px 20px 12px; }
    .panel--sand .panel__head h2 { font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #522b0a; }
    .panel--sand .panel__body { padding: 16px 20px 18px; }
    .panel--sand .hint { color: var(--sand-muted); }
    .panel--sand .kv dt { color: var(--sand-muted); }
    .panel--sand .kv dd { font-size: 16px; }
    .panel--sand a { color: var(--sand-ember); }
    .panel--sand .timeline small { color: var(--sand-muted); }
    .panel--sand .table-wrap--sand { border-left: 0; }
    .panel--sand .money .total { background: var(--field-ink); color: var(--field); padding: 14px 14px; margin: 8px -6px 0; }
    .panel--sand .money .due { color: var(--ember-hi); font-size: 22px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; margin: 0; }
    .kv dt { color: var(--muted); font-size: 14px; }
    .kv dd { margin: 0; }
    .money { display: grid; gap: 8px; }
    .money div { display: flex; justify-content: space-between; gap: 12px; }
    .money .total { background: var(--field); color: var(--field-ink); padding: 10px 12px; margin-top: 6px; font-weight: 500; align-items: baseline; }
    .money .due { color: var(--sand-ember); font-weight: 600; font-size: 17px; }
    .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    .timeline li { display: grid; grid-template-columns: 12px 1fr; gap: 12px; }
    .timeline li::before { content: ''; width: 9px; height: 9px; border-radius: 0; margin-top: 6px; background: var(--ember); }
    .timeline small { display: block; color: var(--dim); font-size: 13px; }
    .actions { display: grid; gap: 10px; }
    /* A warning is an alert, so it's dark (inside a sand list it's a dark band) */
    .flag { display: inline-block; margin-top: 8px; padding: 7px 12px; background: var(--field-ink); color: var(--text); border-left: 3px solid var(--ember); font-size: 13.5px; }

    /* ── Calendar ─────────────────────────────────────────────────────────── */
    .cal-wrap { overflow-x: auto; }
    .cal { border-collapse: separate; border-spacing: 0; min-width: 100%; }
    .cal th, .cal td { border-bottom: 1px solid var(--line); padding: 0; text-align: center; }
    .cal thead th { padding: 10px 4px; font-size: 12px; text-transform: none; letter-spacing: 0; }
    .cal thead th b { display: block; font-size: 15px; color: var(--text); font-weight: 600; }
    .cal thead th.weekend { background: rgba(255, 255, 255, .02); }
    /* After .weekend on purpose: today can be a Saturday or Sunday, and sand must win */
    .cal thead th.today { background: var(--field); color: var(--field-ink); }
    .cal thead th.today b { color: var(--field-ink); }
    .cal .room { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; padding: 12px 16px; min-width: 190px; border-right: 1px solid var(--line); }
    .cal .room b { display: block; font-weight: 500; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; }
    .cal .room span { color: var(--dim); font-size: 12.5px; text-transform: none; letter-spacing: 0; font-weight: 400; }
    .cell { display: grid; place-items: center; min-width: 44px; height: 48px; margin: 3px; border-radius: 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; border: 1px solid transparent; background: none; width: calc(100% - 6px); color: var(--text); }
    .cell:hover { border-color: var(--line-2); }
        /* fullness: more booked = more ember */
    .cell[data-level="0"] { background: rgba(255, 255, 255, .025); }
    .cell[data-level="1"] { background: rgba(200, 120, 42, .12); }
    .cell[data-level="2"] { background: rgba(200, 120, 42, .26); }
    .cell[data-level="3"] { background: rgba(200, 120, 42, .45); }
    .cell[data-level="full"] { background: var(--ember); color: #120c06; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 14px 18px; border-top: 1px solid var(--line); }
    .legend__key { font-weight: 600; margin-right: 6px; }
    .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 0; vertical-align: -2px; margin-right: 6px; }

    /* Calendar on sand: the same meaning, re-coloured for paper. Free = lighter paper; more
       booked = more ember; full = solid ember. Today, highlighted in sand on the dark page,
       inverts to a dark column here (sand on sand would vanish). */
    .panel--sand .cal th, .panel--sand .cal td { border-bottom-color: rgba(28, 22, 16, .14); }
    .panel--sand .cal thead th { color: var(--sand-muted); }
    .panel--sand .cal thead th b { color: var(--field-ink); font-size: 16px; }
    .panel--sand .cal thead th.weekend { background: rgba(28, 22, 16, .05); }
    .panel--sand .cal thead th.today { background: var(--field-ink); color: var(--field); }
    .panel--sand .cal thead th.today b { color: var(--ember-hi); }
    .panel--sand .cal .room { background: var(--field); border-right-color: rgba(28, 22, 16, .16); }
    .panel--sand .cal .room b { color: var(--field-ink); font-size: 15px; }
    .panel--sand .cal .room span { color: var(--sand-muted); }
    .panel--sand .cell { color: var(--field-ink); font-weight: 500; }
    .panel--sand .cell:hover { border-color: rgba(28, 22, 16, .45); }
    .panel--sand .cell[data-level="0"], .sw[data-level="0"] { background-color: rgba(255, 255, 255, .38); }
    .panel--sand .cell[data-level="1"], .sw[data-level="1"] { background-color: rgba(200, 120, 42, .16); }
    .panel--sand .cell[data-level="2"], .sw[data-level="2"] { background-color: rgba(200, 120, 42, .30); }
    .panel--sand .cell[data-level="3"], .sw[data-level="3"] { background-color: rgba(200, 120, 42, .50); }
    .panel--sand .cell[data-level="full"], .sw[data-level="full"] { background-color: var(--ember); color: #120c06; }
    /* A night's guest list: how many rooms each has, as a number at the right end of the row */
    .row__rooms { text-align: right; line-height: 1.1; min-width: 56px; }
    .row__rooms b { display: block; font-size: 28px; font-weight: 600; color: var(--field-ink); font-variant-numeric: tabular-nums; }
    .row__rooms span { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--sand-muted); }
    .sw--today { background: var(--field-ink); }
    .panel--sand .legend { color: var(--sand-muted); border-top-color: rgba(28, 22, 16, .16); }
    .panel--sand .legend i { outline: 1px solid rgba(28, 22, 16, .2); outline-offset: -1px; }
    /* Who's staying (the night panel) */
    .panel--sand .row { border-top-color: rgba(28, 22, 16, .14); }
    .panel--sand .row__name a { color: var(--field-ink); }
    .panel--sand .row__name a:hover { color: var(--sand-ember); }
    .panel--sand .row__meta, .panel--sand .empty { color: var(--sand-muted); }

    /* ── Rates (rooms and experiences) ────────────────────────────────────────────────────── */
    /* Experiences: departures as day sheets (like Today's lists); trips as cards (like rooms) */
    .xp-days { display: grid; gap: 20px; }
    .xp-title--first { margin-top: 8px !important; }
    .xp-title { margin: 40px 0 12px; font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--ember-hi); }
    .dep { padding: 14px 0; border-top: 1px solid rgba(28, 22, 16, .16); }
    .dep__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .dep__what { font-size: 17px; font-weight: 500; }
    .dep__what b { font-variant-numeric: tabular-nums; margin-right: 6px; }
    .dep__count { font-size: 15px; color: var(--sand-muted); font-variant-numeric: tabular-nums; }
    .dep__count strong { color: var(--sand-ember); font-weight: 600; }
    .dep__who { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
    .dep__who li { font-size: 15px; color: #3d3024; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .dep__who a { color: var(--field-ink); }
    .dep__who a:hover { color: var(--sand-ember); }
    .room-card { display: grid; gap: 18px; }
    .room-card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .room-card h3 { font-family: var(--serif); font-size: 20px; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .fact { background: var(--panel-2); border-radius: 0; padding: 10px 12px; }
    .fact span { display: block; font-size: 12.5px; color: var(--muted); }
    .fact b { font-weight: 500; font-size: 17px; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--ember); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; align-items: end; }
    /* The room and trip cards are forms. Their figures are read-only facts, so they're plain text
       on the dark card, split by thin rules: nothing about them looks clickable. The only light
       shapes on the card are the white fields you type in, and Save. */
    .fact { background: none; padding: 2px 14px; border-left: 1px solid var(--line-2); }
    .fact:first-child { padding-left: 0; border-left: 0; }
    .fact span { font-size: 13px; color: var(--dim); white-space: nowrap; }   /* sentence case: "Trips a day" fits a third of a card without wrapping */
    .fact b { font-weight: 600; font-size: 20px; color: var(--text); }
    .room-card .facts { padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .room-card__save { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .room-card__save .hint { margin: 0; }
    .room-card__save .hint.is-dirty { color: var(--ember-hi); font-weight: 500; }
    .form-grid--3 { align-items: start; }   /* the times field has a hint under it: line the fields up by their tops */

    /* Rates, rooms and experiences (Oct 2026): one card per row, read left to right — name, its
       figures, the fields, Save — so every room or trip lines up with the one above it and the
       prices can be compared straight down the page. Narrower screens fall back to the
       stacked card. */
    @media (min-width: 1100px) {
      .card-rows .room-card { grid-template-columns: minmax(210px, 1fr) minmax(420px, 2.6fr) 150px;   /* name | fields | save: everything on the card can be edited */ align-items: center; gap: 0 32px; padding: 22px 24px; }
      .card-rows .room-card__top { flex-direction: column; gap: 12px; }
      .card-rows .room-card .facts { border: 0; padding: 0; grid-template-columns: 1fr; }
      .card-rows .form-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .card-rows .field label { white-space: nowrap; }   /* one line each, so the fields line up across the row */
      .card-rows .form-grid--3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr); }
      .card-rows .room-card__save { flex-direction: column-reverse; align-items: stretch; text-align: center; gap: 8px; }
    }

    /* ── Enquiries ────────────────────────────────────────────────────────── */
    .inbox { display: grid; grid-template-columns: 360px 1fr; min-height: 520px; }
    .inbox__list { border-right: 1px solid var(--line); list-style: none; margin: 0; padding: 0; overflow-y: auto; }
    .inbox__item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; cursor: pointer; color: inherit; }
    .inbox__item:hover { background: var(--panel-2); }
    .inbox__item[aria-current="true"] { background: var(--panel-3); box-shadow: inset 2px 0 0 var(--ember); }
    .inbox__top { display: flex; justify-content: space-between; gap: 10px; }
    .inbox__item b { font-weight: 500; }
    /* Unread: a round dot, like the other notifications (Today's counts), not a square */
    .inbox__item.unread b::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ember-hi); margin-right: 8px; vertical-align: 1px; }
    .inbox__item small { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
    .inbox__item p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inbox__read { padding: 24px 28px; }
    .inbox__read h2 { font-family: var(--serif); font-size: 22px; margin-bottom: 4px; }
    .inbox__from { margin: 0; color: var(--muted); }
    /* The inbox on sand */
    /* Clear lines: a firm rule between the list and the open message, and a visible line under
       every message in the list, so each one reads as its own item */
    .panel--sand .inbox__list { border-right: 2px solid rgba(28, 22, 16, .38); }
    .panel--sand .inbox__item { border-bottom: 1px solid rgba(28, 22, 16, .3); }
    .panel--sand .inbox__item:hover { background: rgba(28, 22, 16, .06); }
    .panel--sand .inbox__item[aria-current="true"] { background: rgba(28, 22, 16, .11); box-shadow: inset 0 0 0 2px var(--ember); }   /* the open one: framed in ember all round */
    .panel--sand .inbox__item b { color: var(--field-ink); }
    .panel--sand .inbox__item.unread b { font-weight: 700; }
    .panel--sand .inbox__item.unread b::before { background: var(--ember); }
    .panel--sand .inbox__item small, .panel--sand .inbox__item p, .panel--sand .inbox__from { color: var(--sand-muted); }
    /* The message's subject is data (a guest's words, or "Enquiry"), so it takes the reading face, not Playfair */
    .panel--sand .inbox__read h2 { color: var(--field-ink); font-family: var(--sans); font-weight: 600; font-size: 20px; }
    /* The open message: the guest's words are what staff read most carefully here. The body stands apart from the details above and the buttons
       below, with room and a hairline on each side. */
    .panel--sand.inbox { background: #f3ece0; }   /* the whole inbox on a light, warm sand: softer than white, lighter than the data sheets (Oct 2026) */
    .panel--sand .message { color: var(--field-ink); font-size: 17px; }
    .message { white-space: pre-wrap; line-height: 1.75; margin: 28px 0; padding: 26px 0; max-width: 640px;
      border-top: 1px solid rgba(28, 22, 16, .14); border-bottom: 1px solid rgba(28, 22, 16, .14); }

    /* ── Charts (Today: occupancy ahead, money) ───────────────────────────────
       Built from plain HTML, so they reflow at any width with no SVG scaling of the text.
       Thin columns (24px at most, 4px rounded top, square at the baseline), a 2px gap of the
       panel's colour between neighbours and between stacked parts, hairline grid. Colours were
       run through the palette checker against this dark panel (colour-blind safe, 3:1+):
       ember for deposits and nights booked, blue for balances. Text never takes a series colour.
       Every value is also in the table under each chart ("Show as a table"). */
    :root { --viz-1: #c8782a; --viz-1-hi: #e8954a; --viz-2: #4a86c8; --viz-2-hi: #6a9fd8; }
    .viz-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 44px 0 14px; }
    .viz-head .xp-title { margin: 0; }
    .viz-head p { margin: 0; color: var(--muted); font-size: 14px; }
    .viz-head strong { color: var(--text); font-weight: 600; }
    .money-tiles { grid-template-columns: repeat(3, 1fr); margin-bottom: 20px; }
    .stat__n--sans { font-family: var(--sans); font-weight: 600; font-size: 30px; }
    .stat__n--sans small { font-size: 15px; font-weight: 500; }
    .stat__s { font-size: 13px; color: var(--dim); }
    .viz { padding: 18px 20px 16px; }
    .viz__legend { display: flex; gap: 18px; flex-wrap: wrap; margin: 0 0 14px; font-size: 13px; color: var(--muted); list-style: none; padding: 0; }
    .viz__legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
    .chart { position: relative; display: grid; grid-template-columns: 52px 1fr; }
    .chart__y { position: relative; }
    .chart__y span { position: absolute; right: 10px; transform: translateY(50%); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chart__plot { position: relative; height: 190px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line-2); }
    .chart__plot:focus-visible { outline-offset: 6px; }
    .chart__grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); pointer-events: none; }
    .chart__x { grid-column: 2; position: relative; height: 26px; }
    .chart__x span { position: absolute; top: 7px; transform: translateX(-50%); font-size: 12px; color: var(--dim); white-space: nowrap; }
    /* One column: the whole slot is the hover target, the painted bar sits centred in it */
    .vbar { position: relative; flex: 1 1 0; height: 100%; display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; min-width: 0; }
    .vbar__fill { width: 100%; max-width: 24px; flex: none; background: var(--viz-1); }
    .vbar__fill:last-child { border-radius: 4px 4px 0 0; }   /* rounded at the data end only */
    .vbar__fill--2 { background: var(--viz-2); }
    .vbar.is-active .vbar__fill { background: var(--viz-1-hi); }
    .vbar.is-active .vbar__fill--2 { background: var(--viz-2-hi); }
    .vbar.is-active::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, .04); }
    .vbar__label { position: absolute; transform: translate(-50%, -6px); font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; pointer-events: none; }
    .viz-tip { position: absolute; z-index: 5; pointer-events: none; min-width: 150px; padding: 9px 12px; background: var(--panel-3); border: 1px solid var(--line-2);
      box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 13px; line-height: 1.45; }
    .viz-tip[hidden] { display: none; }
    .viz-tip b { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
    .viz-tip span { display: block; color: var(--muted); }
    .viz-tip i { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: 3px; }
    .viz details { margin-top: 10px; font-size: 13.5px; }
    .viz summary { cursor: pointer; color: var(--muted); width: max-content; }
    .viz summary:hover { color: var(--text); }
    .viz details table { margin-top: 10px; }
    .viz details td, .viz details th { padding: 7px 12px; font-size: 13.5px; }
    @media (max-width: 900px) {
      /* .stats.money-tiles outranks the 2-by-2 rule for Today's first band further down */
      .stats.money-tiles { grid-template-columns: 1fr; }
      .stats.money-tiles .stat { border-left: 0; border-top: 1px solid var(--line); }
      .stats.money-tiles .stat:first-child { border-top: 0; }
      .stat__n--sans { font-size: 26px; }
      .chart { grid-template-columns: 40px 1fr; }
      .chart__plot { height: 160px; gap: 1px; }
    }

    /* ── Dialog and toast ─────────────────────────────────────────────────── */
    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line-2); border-radius: 0; padding: 0; width: min(460px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgba(0, 0, 0, .65); }
    .dlg { padding: 24px; display: grid; gap: 16px; }
    .dlg h2 { font-family: var(--serif); font-size: 22px; }
    .dlg p { margin: 0; color: var(--muted); }
    .dlg__actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel-3); border: 1px solid var(--line-2);
             padding: 12px 18px; border-radius: 0; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100vw - 32px); z-index: 50; }
    .toast[hidden] { display: none; }

    /* ==========================================================================
       RESPONSIVE: desktop first; tablets lose columns; phones get a drawer and cards
    ========================================================================== */
    @media (max-width: 1180px) {
      .detail { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 40; transform: translateX(-100%); transition: transform .25s ease; }
      .shell.nav-open .side { transform: none; box-shadow: 0 0 60px rgba(0,0,0,.7); }
      .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; }
      .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; padding: 10px 14px;
                background: var(--panel); border-bottom: 1px solid var(--line); }
      .topbar img { width: 28px; height: 28px; }
      .topbar b { font-family: var(--serif); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .14em; color: var(--ember); }
      .burger { background: none; border: 1px solid var(--line-2); border-radius: 0; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; }
      .burger svg { width: 20px; height: 20px; stroke: var(--text); }
      .page { padding: 22px 16px 56px; }
      .page__title { font-size: 25px; }
      .page__head--today .page__title { font-size: 36px; }
      .page__head--today .page__sub { font-size: 18px; }
      .page__head--big .page__title { font-size: 34px; }
      .page__head--big .page__sub { font-size: 16px; }
      .page__head--big .page__sub.page__note { font-size: 14px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat { padding: 16px 18px; }
      .stat:nth-child(3) { border-left: 0; }
      .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
      .stat__n { font-size: 32px; }
      .stat__n small { font-size: 15px; }
      .stat__n .stat__also { margin-left: 7px; padding-left: 7px; }
      .notice__n { width: 30px; height: 30px; font-size: 15px; }
      .notice__k { font-size: 12px; }
      .sheet { padding: 14px 16px 6px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .inbox { grid-template-columns: 1fr; }
      .inbox__list { border-right: 0; max-height: none; }
      .inbox.reading .inbox__list { display: none; }
      .inbox:not(.reading) .inbox__read { display: none; }
      .inbox__read { padding: 18px; }
    }
    @media (min-width: 901px) { .back-to-list { display: none; } }
    @media (max-width: 380px) {   /* too narrow for "5 rooms | 6 guests" on one line: guests go underneath, no rule */
      .stat__n .stat__also { display: block; margin: 6px 0 0; padding: 0; border: 0; }
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
      .kv { grid-template-columns: 1fr; gap: 2px 0; }
      .kv dd { margin-bottom: 10px; }
      .facts { grid-template-columns: 1fr 1fr 1fr; }
      /* Bookings table becomes a list of cards: each cell shows its column name from data-label */
      .table--cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .table--cards tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
      .table-wrap--sand .table--cards tbody tr { border-bottom-color: rgba(28, 22, 16, .14); }
      .table-wrap--sand .table--cards td[data-label]::before { color: var(--sand-muted); }
      .table--cards td { border: 0; padding: 0; }
      .table--cards td[data-label]::before { content: attr(data-label) ' · '; color: var(--dim); font-size: 12.5px; font-weight: 400; }   /* the label stays light even where the value is bold */
      .table--cards td.c-ref { grid-column: 1; }
      .table--cards td.c-status { grid-column: 2; grid-row: 1; justify-self: end; }
      .table--cards td.c-guest, .table--cards td.c-stay, .table--cards td.c-money { grid-column: 1 / -1; }
      .table--cards td.c-count { grid-column: 1 / -1; text-align: left; }
      .table--cards td.c-hide, .table--cards .sub.c-hide { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .side { transition: none; } }

    /* ── Jost where it's a figure or a label ─────────────────────────────────────────────
       Last on purpose, so it wins over each component's own font. Numbers inside a sentence
       ("Monday 26 October, from 14:00", "KES 273,350 to pay") stay in the reading face:
       switching fonts mid-sentence looks broken. */
    .stat__n, .stat__k, .notice__n, .notice__k, .nav .count, .who__avatar,
    .cell, .cal thead th b, .fact b, .row__rooms, .dep__what b,
    td.right.num, .ref, .money > div:not(.hint) > span:last-child, .money .due,
    th, .tabs button, .btn, .chip, .panel__head h2, .list__head h2, .xp-title, .request__k,
    .side__brand small, .vbar__label, .viz-tip b, .chart__y span { font-family: var(--figure); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dlg"></dialog>

  <script>
  /* ============================================================================================
     SAFARI EMBER ADMIN · SCRIPT
     How it's built, so the backend can slot in later:
       API     every number and name comes from /api/admin (api/src/routes/admin.js)
       VIEWS   one function per screen; each returns HTML built ONLY through esc() for any value
               that came from a guest or staff member (see the warning on esc)
       ROUTER  the address after # decides the screen: #/today, #/bookings, #/booking/SE-…, …
  ============================================================================================ */
  (function () {
    'use strict';

    /* ── Helpers ─────────────────────────────────────────────────────────────────────────── */

    // SECURITY: guest names, requests and enquiry messages are typed by the public. Putting them
    // into HTML unescaped would let someone "book" under a name that contains a script tag and
    // run code in the manager's browser (stored XSS). (Never write a closing script tag inside
    // this script, even in a comment: the browser would end the script right there.) Every value from data goes through esc() before it is
    // placed in a template. Numbers and our own labels don't need it, but it never hurts.
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    var KES = new Intl.NumberFormat('en-KE');
    function money(n) { return 'KES ' + KES.format(n); }

    // Dates are plain YYYY-MM-DD strings in Nairobi time, like the database `date` columns.
    // Doing the maths in UTC on those strings means no time zone can shift a day.
    function todayNairobi() {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Nairobi' }).format(new Date());
    }
    function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5); }
    function fmtDate(iso, opts) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', Object.assign({ day: 'numeric', month: 'short', timeZone: 'UTC' }, opts || {})); }
    function fmtLong(iso) { return fmtDate(iso, { weekday: 'long', day: 'numeric', month: 'long' }); }
    function fmtDateTime(ms) { return new Date(ms).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Nairobi' }); }
    function stayLabel(b) { return fmtDate(b.checkIn) + ' – ' + fmtDate(b.checkOut, { year: daysBetween(TODAY, b.checkOut) > 300 ? 'numeric' : undefined }); }
    function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

    var TODAY = todayNairobi();


    /* ── API ─────────────────────────────────────────────────────────────────────────────── */

    // Everything comes from /api/admin (api/src/routes/admin.js), with the session cookie the API
    // sets at sign-in. The cookie is httpOnly: this script never sees it, it just rides along.
    // The API checks the session (and the 6-digit code) on every request: hiding a button here
    // is only for clarity, never protection.
    function api(path, opts) {
      opts = opts || {};
      var init = { method: opts.method || 'GET', credentials: 'same-origin', headers: { Accept: 'application/json' } };
      if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
      return fetch('/api/admin' + path, init).then(function (res) {
        if (res.status === 204) return {};
        return res.json().catch(function () { return {}; }).then(function (body) {
          if (!res.ok) {
            var e = new Error(body.error || 'Something went wrong. Please try again.');
            e.status = res.status; e.needsTotp = !!body.needsTotp; throw e;
          }
          return body;
        });
      }, function () {
        var e = new Error('Can’t reach the booking system. Check the connection and try again.'); e.status = 0; throw e;
      });
    }
    function qs(o) {
      return Object.keys(o).filter(function (k) { return o[k] !== '' && o[k] != null; })
        .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(o[k]); }).join('&');
    }

    /* ── Shared bits ─────────────────────────────────────────────────────────────────────── */

    var STATUS_WORD = { HELD: 'Held', CONFIRMED: 'Confirmed', INHOUSE: 'In house', COMPLETED: 'Completed', EXPIRED: 'Expired', CANCELLED: 'Cancelled', NEW: 'New', HANDLED: 'Handled' };
    function chip(st) { return '<span class="chip chip--' + st + '">' + STATUS_WORD[st] + '</span>'; }
    function guestName(b) { return esc(b.firstName + ' ' + b.lastName); }
    /** "2 × Hearthside Room, The Coalbed Suite" */
    function roomsLabel(b) { return b.rooms.map(function (r) { return (r.units > 1 ? r.units + ' × ' : '') + esc(r.name); }).join(', ') || '—'; }
    function roomCount(b) { return b.rooms.reduce(function (n, r) { return n + r.units; }, 0); }
    function readOnly() { return S.me && S.me.masked; }

    var ICONS = {
      today: '<path d="M4 6h16v14H4z"/><path d="M4 10h16M9 3v4M15 3v4"/>',
      bookings: '<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>',
      calendar: '<path d="M4 5h16v15H4z"/><path d="M4 10h16M10 10v10M15 10v10"/>',
      rooms: '<path d="M3 18V8l9-4 9 4v10"/><path d="M3 18h18M8 18v-5h8v5"/>',
      experiences: '<circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
      enquiries: '<path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/>',
    };
    function icon(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }

    var toastTimer;
    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.hidden = false;
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
    }

    // A confirm dialog built on <dialog>: focus is trapped and Esc closes it, for free
    function confirmDialog(opts) {
      var d = document.getElementById('dlg');
      d.innerHTML = '<form method="dialog" class="dlg">' +
        '<h2>' + esc(opts.title) + '</h2><p>' + esc(opts.body) + '</p>' +
        (opts.field ? '<div class="field"><label for="dlg-field">' + esc(opts.field) + '</label><textarea class="input" id="dlg-field" rows="3" required minlength="3" maxlength="300"></textarea></div>' : '') +
        '<div class="dlg__actions"><button class="btn" value="cancel" formnovalidate>Keep it</button>' +
        '<button class="btn ' + (opts.danger ? 'btn--danger' : 'btn--primary') + '" value="ok">' + esc(opts.ok) + '</button></div></form>';
      d.onclose = function () {
        if (d.returnValue === 'ok') opts.onOk(opts.field ? d.querySelector('#dlg-field').value.trim() : null);
      };
      d.showModal();
    }

    /* ── STATE ───────────────────────────────────────────────────────────────────────────── */

    // me: the signed-in admin from the API ({ name, role, masked, needsTotp }), or null.
    var S = { me: null, checked: false, stage: 'password', bookingsFilter: 'upcoming', bookingsRoom: 'all', bookingsQ: '',
              calStart: TODAY, xpStart: TODAY, enquiry: null, reading: false, newEnq: 0, rooms: null };

    /* ── VIEWS ───────────────────────────────────────────────────────────────────────────── */

    function viewLogin(error) {
      var two = S.stage === 'code';
      return '<main class="auth"><div class="auth__card">' +
        '<div class="auth__brand"><img src="mark.webp" alt="" /><h1>Safari Ember</h1><p>Staff sign-in</p></div>' +
        (two
          ? '<form id="f-code" novalidate>' +
              '<div class="field"><label for="code">6-digit code from your authenticator app</label>' +
              '<input class="input code-input" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required /></div>' +
              (error ? '<p class="auth__error" role="alert">' + esc(error) + '</p>' : '') +
              '<button class="btn btn--primary btn--plain">Verify and sign in</button>' +
              '<p class="hint" style="margin:0">Codes change every 30 seconds.</p>' +
            '</form>' +
            '<div class="auth__foot"><button type="button" id="restart">Back to email and password</button></div>'
          : '<form id="f-login" novalidate>' +
              '<div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" required /></div>' +
              '<div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" required /></div>' +
              (error ? '<p class="auth__error" role="alert">' + esc(error) + '</p>' : '') +
              '<button class="btn btn--primary btn--plain">Continue</button>' +
            '</form>') +
        '</div></main>';
    }

    function shell(active, inner) {
      var newEnq = S.newEnq;
      var items = [['today', '#/today', 'Today'], ['bookings', '#/bookings', 'Bookings'], ['calendar', '#/calendar', 'Calendar'],
                   ['experiences', '#/experiences', 'Experiences'], ['rooms', '#/rooms', 'Rates'], ['enquiries', '#/enquiries', 'Enquiries']];
      var name = S.me ? S.me.name : '';
      var initials = name.split(/\s+/).map(function (w) { return w[0] || ''; }).join('').slice(0, 2).toUpperCase();
      return '<div class="shell" id="shell">' +
        '<aside class="side" id="side" aria-label="Admin">' +
          '<a class="side__brand" href="#/today"><img src="mark.webp" alt="" /><span><b>Safari Ember</b><small>Admin</small></span></a>' +
          '<nav class="nav">' + items.map(function (it) {
            return '<a href="' + it[1] + '"' + (active === it[0] ? ' aria-current="page"' : '') + '>' + icon(it[0]) + '<span>' + it[2] + '</span>' +
              (it[0] === 'enquiries' && newEnq ? '<span class="count" aria-label="' + newEnq + ' new">' + newEnq + '</span>' : '') + '</a>';
          }).join('') + '</nav>' +
          '<div class="side__foot">' +
            '<div class="who"><div class="who__avatar" aria-hidden="true">' + esc(initials) + '</div><div><b>' + esc(name) + '</b><small>' + (readOnly() ? 'Demo account' : 'Admin') + '</small></div></div>' +
            '<button class="btn side__signout" id="signout" type="button">Sign out</button>' +
            (readOnly() ? '<p class="demo-note">Demo account: look around freely. Guests’ details are hidden and nothing can be changed.</p>' : '') +
          '</div>' +
        '</aside>' +
        '<div class="main">' +
          '<header class="topbar"><button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="side">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>' +
            '<img src="mark.webp" alt="" /><b>Safari Ember</b></header>' +
          '<main class="page" id="main" tabindex="-1">' + inner + '</main>' +
        '</div></div>';
    }

    function problemHtml(e) {
      // A booking that doesn't exist won't appear by trying again: offer the way back instead
      if (e.status === 404) return '<div class="problem" role="alert"><p>' + esc(e.message) + '</p><a class="btn" href="#/bookings">Back to bookings</a></div>';
      return '<div class="problem" role="alert"><p>' + esc(e.message) + '</p><button class="btn" type="button" id="retry">Try again</button></div>';
    }

    /* Today: what reception needs at 7am. Arrivals and departures with one-tap actions,
       who's in house, holds about to expire, and how full tonight is. */
    function viewToday(t) {
      // Option A (Oct 2026): one line of numbers, notifications (holds, enquiries), then two lists on sand.
      S.newEnq = t.newEnquiries;
      var pct = t.tonight.open ? Math.round(t.tonight.taken / t.tonight.open * 100) : 0;
      var done = '<span class="done-mark">✓ ';
      var ro = readOnly();

      function arrivalRow(b) {
        var inn = b.status === 'INHOUSE';
        return '<li class="row' + (inn ? ' is-done' : '') + '"><div><div class="row__name"><a href="#/booking/' + b.ref + '">' + guestName(b) + '</a></div>' +
          '<div class="row__meta">' + roomsLabel(b) + ' · ' + plural(b.nights, 'night') + ' · ' + plural(b.guests, 'guest') + '</div>' +
          (b.requests ? '<div class="row__note">' + esc(b.requests) + '</div>' : '') + '</div>' +
          '<div class="row__actions">' + (inn ? done + 'Checked in</span>'
            : ro ? '' : '<button class="btn btn--primary btn--small" data-act="checkin" data-ref="' + b.ref + '">Check in</button>') + '</div></li>';
      }
      function departureRow(b) {
        var out = b.status === 'COMPLETED';
        return '<li class="row' + (out ? ' is-done' : '') + '"><div><div class="row__name"><a href="#/booking/' + b.ref + '">' + guestName(b) + '</a></div>' +
          '<div class="row__meta">' + roomsLabel(b) +
            // Once out, just the rooms: the balance being paid isn't recorded, so don't claim it
            (out ? '' : ' · ' + (b.balanceKes > 0 ? '<span class="num">' + money(b.balanceKes) + '</span> to pay' : 'paid in full')) + '</div></div>' +
          '<div class="row__actions">' + (out ? done + 'Checked out</span>'
            : ro ? '' : '<button class="btn btn--primary btn--small" data-act="checkout" data-ref="' + b.ref + '" data-name="' + guestName(b) + '" data-due="' + b.balanceKes + '">Check out</button>') + '</div></li>';
      }
      function list(id, title, hint, rows, empty) {
        return '<section class="sheet" aria-labelledby="' + id + '"><div class="list__head"><h2 id="' + id + '">' + title + '</h2><p class="hint">' + hint + '</p></div>' +
          (rows.length ? '<ul class="rows rows--plain">' + rows.join('') + '</ul>' : '<p class="empty">' + empty + '</p>') + '</section>';
      }

      // Notifications: only when there's something waiting. Just the count and the word (Oct 2026):
      // read aloud as "2 Holds". The link goes to the list that explains them.
      function notice(n, label, href, extra) {
        return '<a class="notice" href="' + href + '"' + (extra || '') + '><span class="notice__n">' + n + '</span>' +
          '<span class="notice__k">' + label + '</span></a>';
      }
      var holds = t.holds, newEnq = t.newEnquiries, refunds = t.refunds;
      S.refunds = refunds;
      // Money owed back comes first: it's the one a guest is waiting on
      var notes = (refunds ? notice(refunds, refunds === 1 ? 'Refund' : 'Refunds', '#/bookings', ' data-act="showrefunds"') : '') +
                  (holds.length ? notice(holds.length, holds.length === 1 ? 'Hold' : 'Holds', '#/bookings', ' data-act="showheld"') : '') +
                  (newEnq ? notice(newEnq, newEnq === 1 ? 'Enquiry' : 'Enquiries', '#/enquiries') : '');
      var guests = t.inHouse.guests;
      function stat(n, label, href, extra) {
        var inner = '<span class="stat__n">' + n + '</span><span class="stat__k">' + label + '</span>';
        return href ? '<a class="stat' + (extra || '') + '" href="' + href + '">' + inner + '</a>' : '<div class="stat' + (extra || '') + '">' + inner + '</div>';
      }

      return '<div class="page__head page__head--today"><div><h1 class="page__title">Today</h1><p class="page__sub">' + fmtLong(t.date) + '</p></div></div>' +
        '<div class="stats">' +
          stat(t.arrivals.filter(function (b) { return b.status !== 'INHOUSE'; }).length, 'Arriving') +
          stat(t.departures.filter(function (b) { return b.status !== 'COMPLETED'; }).length, 'Leaving') +
          // "2 rooms | 3 guests": both units written out (a dot between two numbers read as "2.3")
          stat(t.inHouse.rooms + ' <small>' + (t.inHouse.rooms === 1 ? 'room' : 'rooms') + '</small>' +
               '<small class="stat__also">' + plural(guests, 'guest') + '</small>', 'In house') +
          stat(pct + '%', 'Full tonight · ' + t.tonight.taken + ' of ' + t.tonight.open, '#/calendar') +
        '</div>' +
        (notes ? '<div class="notes">' + notes + '</div>' : '') +
        '<div class="grid-2 grid-2--wide">' +
          list('h-arr', 'Arriving', 'check-in from 14:00', t.arrivals.map(arrivalRow), 'No arrivals today.') +
          list('h-dep', 'Leaving', 'check-out by 11:00', t.departures.map(departureRow), 'No departures today.') +
        '</div>' +
        (t.stats ? statsHtml(t.stats) : '');
    }


    /* ── Today's charts ──────────────────────────────────────────────────────────────────────
       Two charts, each a row of columns in plain HTML (see the CSS), each with a table twin.
       Values for the hover box live in data attributes and are written with textContent. */
    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function compact(n) {                                    // 1,250,000 → 1.25M, 340,000 → 340K
      return n >= 1e6 ? (Math.round(n / 1e4) / 100) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n);
    }
    function niceMax(v) {                                    // a clean top for the y axis
      if (v <= 0) return 1;
      var p = Math.pow(10, Math.floor(Math.log10(v))), steps = [1, 2, 2.5, 5, 10];
      for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p;
      return 10 * p;
    }
    function monthName(ym, long) { var m = MONTHS[Number(ym.slice(5)) - 1]; return long ? m + ' ' + ym.slice(0, 4) : m; }

    function statsHtml(st) {
      // ── Occupancy, next 30 nights ──
      var n = st.occupancy.nights;
      var pcts = n.map(function (x) { return x.open ? Math.round(x.taken / x.open * 100) : 0; });
      var avg = pcts.length ? Math.round(pcts.reduce(function (a, b) { return a + b; }, 0) / pcts.length) : 0;
      var peak = 0; pcts.forEach(function (p, i) { if (p > pcts[peak]) peak = i; });
      var occBars = n.map(function (x, i) {
        var label = fmtLong(x.night);
        return '<div class="vbar" data-i="' + i + '" data-t1="' + esc(label) + '" data-v1="' + pcts[i] + '% booked" data-s1="' + x.taken + ' of ' + x.open + ' rooms">' +
          '<span class="vbar__fill" style="height:' + pcts[i] + '%"></span>' +
          (i === peak && pcts[i] > 0 ? '<span class="vbar__label" style="bottom:' + pcts[i] + '%;left:50%">' + pcts[i] + '%</span>' : '') + '</div>';
      }).join('');
      var occX = n.map(function (x, i) {                    // a date under today and every 7th night after it
        return i % 7 === 0 ? '<span style="left:' + ((i + 0.5) / n.length * 100) + '%">' + (i === 0 ? 'Today' : fmtDate(x.night)) + '</span>' : '';
      }).join('');
      var occTable = '<table><thead><tr><th scope="col">Night</th><th scope="col" class="right">Rooms booked</th><th scope="col" class="right">Full</th></tr></thead><tbody>' +
        n.map(function (x, i) { return '<tr><td>' + fmtLong(x.night) + '</td><td class="right num">' + x.taken + ' of ' + x.open + '</td><td class="right num">' + pcts[i] + '%</td></tr>'; }).join('') + '</tbody></table>';

      // ── Money ──
      var months = st.months, thisMonth = st.date.slice(0, 7);
      var top = niceMax(Math.max.apply(null, months.map(function (m) { return m.depositsKes + m.balancesKes; }).concat([0])));
      var revBars = months.map(function (m, i) {
        var tot = m.depositsKes + m.balancesKes;
        return '<div class="vbar" data-i="' + i + '" data-t1="' + esc(monthName(m.month, true)) + '" data-v1="' + esc(money(tot)) + ' booked"' +
            ' data-s1="Deposits ' + esc(money(m.depositsKes)) + '" data-s2="Balances ' + esc(money(m.balancesKes)) + '">' +
          '<span class="vbar__fill" style="height:' + (m.depositsKes / top * 100) + '%"></span>' +
          (m.balancesKes ? '<span class="vbar__fill vbar__fill--2" style="height:calc(' + (m.balancesKes / top * 100) + '% - 2px)"></span>' : '') +
          (m.month === thisMonth && tot ? '<span class="vbar__label" style="bottom:' + (tot / top * 100) + '%;left:50%">' + compact(tot) + '</span>' : '') + '</div>';
      }).join('');
      var revX = months.map(function (m, i) {
        return '<span style="left:' + ((i + 0.5) / months.length * 100) + '%">' + (m.month === thisMonth ? 'This month' : monthName(m.month)) + '</span>';
      }).join('');
      var revTable = '<table><thead><tr><th scope="col">Check-in month</th><th scope="col" class="right">Deposits</th><th scope="col" class="right">Balances</th><th scope="col" class="right">Total</th></tr></thead><tbody>' +
        months.map(function (m) { return '<tr><td>' + monthName(m.month, true) + '</td><td class="right num">' + money(m.depositsKes) + '</td><td class="right num">' + money(m.balancesKes) + '</td><td class="right num">' + money(m.depositsKes + m.balancesKes) + '</td></tr>'; }).join('') + '</tbody></table>';

      function yAxis(labels) { return '<div class="chart__y" aria-hidden="true">' + labels.map(function (l) { return '<span style="bottom:' + l[0] + '%">' + l[1] + '</span>'; }).join('') + '</div>'; }
      function grid(levels) { return levels.map(function (l) { return '<span class="chart__grid" style="bottom:' + l + '%"></span>'; }).join(''); }
      function chart(name, bars, x, y, levels) {
        return '<div class="chart">' + yAxis(y) +
          '<div class="chart__plot" tabindex="0" role="group" aria-label="' + esc(name) + '. Use the left and right arrow keys to read each column; the table below has every value.">' +
            grid(levels) + bars + '</div><div class="chart__x" aria-hidden="true">' + x + '</div>' +
          '<div class="viz-tip" hidden></div></div>';
      }
      var tile = function (n, label, sub) {
        return '<div class="stat"><span class="stat__n stat__n--sans">' + n + '</span><span class="stat__k">' + label + '</span><span class="stat__s">' + sub + '</span></div>';
      };
      var bk = function (k) { return plural(k, 'booking'); };

      return '<div class="viz-head"><h2 class="xp-title">Next 30 nights</h2><p>Average <strong>' + avg + '% full</strong>' +
          (pcts[peak] > 0 ? ' · busiest ' + fmtDate(n[peak].night, { weekday: 'short' }) + ' (' + pcts[peak] + '%)' : '') + '</p></div>' +
        '<section class="panel viz" aria-label="Rooms booked, next 30 nights">' +
          chart('Rooms booked each night, next 30 nights', occBars, occX, [[0, '0%'], [50, '50%'], [100, '100%']], [50, 100]) +
          '<details><summary>Show as a table</summary><div class="table-wrap">' + occTable + '</div></details></section>' +

        '<div class="viz-head"><h2 class="xp-title">Money</h2><p>Deposits by the day the booking was confirmed</p></div>' +
        '<div class="stats money-tiles">' +
          tile(money(st.deposits.week.kes), 'Deposits this week', bk(st.deposits.week.bookings) + ', from Monday') +
          tile(money(st.deposits.month.kes), 'Deposits this month', bk(st.deposits.month.bookings)) +
          tile(money(st.toCollect.kes), 'To collect at the lodge', 'balances of ' + bk(st.toCollect.bookings) + ' in house or arriving in 7 days') +
        '</div>' +
        '<section class="panel viz" aria-label="Booked revenue by check-in month">' +
          '<ul class="viz__legend"><li><i style="background:var(--viz-1)"></i>Deposits (paid online)</li><li><i style="background:var(--viz-2)"></i>Balances (paid at the lodge)</li></ul>' +
          chart('Booked revenue by check-in month', revBars, revX, [[0, '0'], [50, compact(top / 2)], [100, compact(top)]], [50, 100]) +
          '<details><summary>Show as a table</summary><div class="table-wrap">' + revTable + '</div></details></section>';
    }

    /* Hover, touch and arrow keys show the same box: the column's date or month, then its values */
    function bindCharts() {
      document.querySelectorAll('.chart').forEach(function (c) {
        var plot = c.querySelector('.chart__plot'), tip = c.querySelector('.viz-tip');
        var bars = Array.prototype.slice.call(plot.querySelectorAll('.vbar')), cur = -1;
        function show(i) {
          bars.forEach(function (b, k) { b.classList.toggle('is-active', k === i); });
          if (i < 0) { tip.hidden = true; cur = -1; return; }
          cur = i; var b = bars[i], d = b.dataset;
          tip.textContent = '';
          var t = document.createElement('span'); t.textContent = d.t1; tip.appendChild(t);
          var v = document.createElement('b'); v.textContent = d.v1; tip.appendChild(v);
          [['s1', 'var(--viz-1)'], ['s2', 'var(--viz-2)']].forEach(function (k) {
            if (!d[k[0]]) return;
            var row = document.createElement('span');
            if (d.s2) { var key = document.createElement('i'); key.style.background = k[1]; row.appendChild(key); }   // a line key only when there are two parts
            row.appendChild(document.createTextNode(d[k[0]])); tip.appendChild(row);
          });
          tip.hidden = false;
          // Place it beside the column, kept inside the chart
          var pr = plot.getBoundingClientRect(), cr = c.getBoundingClientRect(), br = b.getBoundingClientRect();
          var x = br.left - cr.left + br.width / 2 + 12;
          if (x + tip.offsetWidth > cr.width) x = br.left - cr.left + br.width / 2 - tip.offsetWidth - 12;
          tip.style.left = Math.max(0, x) + 'px'; tip.style.top = (pr.top - cr.top + 8) + 'px';
        }
        bars.forEach(function (b, i) { b.addEventListener('pointerenter', function () { show(i); }); });
        plot.addEventListener('pointerleave', function () { if (document.activeElement !== plot) show(-1); });
        plot.addEventListener('focus', function () { show(cur < 0 ? 0 : cur); });
        plot.addEventListener('blur', function () { show(-1); });
        plot.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault(); show(Math.min(bars.length - 1, Math.max(0, cur + (e.key === 'ArrowRight' ? 1 : -1))));
          } else if (e.key === 'Escape') show(-1);
        });
      });
    }

    /* Bookings: everything, searchable. Default view = what's coming up. */

    var FILTERS = [['upcoming', 'Upcoming'], ['inhouse', 'In house'], ['held', 'Held'], ['past', 'Past'], ['cancelled', 'Cancelled'], ['refunds', 'Refunds'], ['all', 'All']];   // Refunds shows only while money is owed   // "Cancelled" includes lapsed holds
    function bookingRowsHtml(list) {
      if (!list.length) return '<tr><td colspan="8" class="empty">No bookings match.</td></tr>';
      return list.map(function (b) {
        return '<tr class="clickable" data-href="#/booking/' + b.ref + '">' +
          '<td class="c-ref"><a class="ref" href="#/booking/' + b.ref + '">' + b.ref + '</a></td>' +
          '<td class="c-guest" data-label="Guest">' + guestName(b) + '<span class="sub c-hide">' + esc(b.email) + '</span></td>' +
          // Rooms (the types), how many rooms, and guests: three columns, so each can be scanned down
          '<td class="c-hide c-rooms"><ul class="room-list">' + b.rooms.map(function (r) { return '<li>' + esc(r.name) + '</li>'; }).join('') + '</ul></td>' +
          '<td class="right num c-count" data-label="Rooms">' + roomCount(b) + '</td>' +
          '<td class="right num c-count" data-label="Guests">' + b.guests + '</td>' +
          '<td class="c-stay num" data-label="Stay">' + stayLabel(b) + '<span class="sub c-hide">' + plural(b.nights, 'night') + '</span></td>' +
          '<td class="right num c-money" data-label="Total">' + money(b.totalKes) + '<span class="sub">' + (b.depositPaid ? 'Deposit paid' : 'No deposit yet') + '</span></td>' +

    function bookingsQuery() {

        '<section class="panel">' +
          '<div class="tabs" role="group" aria-label="Show">' + FILTERS.filter(function (f) { return f[0] !== 'refunds' || d.refundsOwed || S.bookingsFilter === 'refunds'; }).map(function (f) { return '<button type="button" data-filter="' + f[0] + '" aria-pressed="' + (S.bookingsFilter === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div>' +

    /* One booking: everything about the stay, the money, and what can be done next */
    function viewBooking(b) {

      nights.sort(function (x, y) { return x.night < y.night ? -1 : x.night > y.night ? 1 : 0; });
      var many = b.rooms.length > 1;

      // No "← Bookings" link: the browser's Back button returns to the list (each screen is its own address)
      return '<div class="page__head page__head--big"><div><h1 class="page__title">' + guestName(b) + '</h1>' +
          '<p class="page__sub"><span class="ref">' + b.ref + '</span> ' + chip(st) + '</p></div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            (b.canCheckIn && !ro ? '<button class="btn btn--primary" data-act="checkin" data-ref="' + b.ref + '">Check in</button>' : '') +
            (b.canCheckOut && !ro ? '<button class="btn btn--primary" data-act="checkout" data-ref="' + b.ref + '" data-name="' + guestName(b) + '" data-due="' + b.balanceKes + '">Check out</button>' : '') +
          '</div></div>' +
        // The guest's request is an alert, styled like Today's notifications (not sand: sand is for data)
        (b.requests ? '<div class="request"><span class="request__k">Guest request</span><p>' + esc(b.requests) + '</p></div>' : '') +
        (b.refundOwed ? '<div class="request" role="status"><span class="request__k">Refund due</span>' +
          (b.refundDue ? '<p>A deposit reached us that this booking couldn’t use' + (st === 'EXPIRED' ? ': the hold had run out and the room had gone to someone else.' : '.') + '</p>' : '') +
          b.payments.filter(function (p) { return p.status === 'FLAGGED'; }).map(function (p) {
            return '<p>' + (p.provider === 'M-Pesa' ? 'An' : 'A') + ' ' + esc(p.provider) + ' payment of ' + (p.receivedKes != null ? money(p.receivedKes) : 'an amount in another currency') + ' arrived where ' + money(p.amountKes) + ' was asked for, so it wasn’t taken as the deposit.</p>';
          }).join('') +
          '<p>Send it back from M-Pesa or Paystack, then mark it here.</p>' +
          (ro ? '' : '<button class="btn btn--primary" data-act="refundsent" data-ref="' + b.ref + '">Mark refund sent</button>') + '</div>' : '') +
        '<div class="detail detail--sand">' +
          '<div class="stack">' +
            '<section class="panel panel--sand"><div class="panel__head"><h2>Stay</h2></div><div class="panel__body"><dl class="kv">' +
              '<dt>' + (roomCount(b) > 1 ? 'Rooms' : 'Room') + '</dt><dd>' + b.rooms.map(function (r) { return (r.units > 1 ? r.units + ' × ' : '') + esc(r.name); }).join('<br>') + '</dd>' +
              '<dt>Check-in</dt><dd>' + fmtLong(b.checkIn) + ', from 14:00</dd>' +
              '<dt>Check-out</dt><dd>' + fmtLong(b.checkOut) + ', by 11:00</dd>' +
              '<dt>Length</dt><dd>' + plural(b.nights, 'night') + ' · ' + plural(b.guests, 'guest') + '</dd>' +
              (b.activities.length ? '<dt>Experiences</dt><dd>' + b.activities.map(function (a) {
                return esc(a.name) + ' <span class="hint">· ' + fmtDate(a.day, { weekday: 'short' }) + ', ' + esc(a.time) + ' · ' + plural(a.people, 'person', 'people') + '</span>';
              }).join('<br>') + '</dd>' : '') +
            '</dl></div></section>' +
            '<section class="panel panel--sand"><div class="panel__head"><h2>Guest</h2></div><div class="panel__body"><dl class="kv">' +
              '<dt>Name</dt><dd>' + guestName(b) + '</dd>' +
              '<dt>Email</dt><dd>' + (ro ? esc(b.email) : '<a href="mailto:' + esc(b.email) + '">' + esc(b.email) + '</a>') + '</dd>' +
              '<dt>Phone</dt><dd>' + (ro ? esc(b.phone) : '<a href="tel:' + esc(String(b.phone).replace(/\s/g, '')) + '">' + esc(b.phone) + '</a>') + '</dd>' +
            '</dl></div></section>' +
            '<section class="panel panel--sand"><div class="panel__head"><h2>Price, night by night</h2><p class="hint">Frozen when the guest booked</p></div>' +
              '<div class="table-wrap table-wrap--sand"><table><thead><tr><th scope="col">Night</th>' + (many ? '<th scope="col">Room</th>' : '') + '<th scope="col" class="right">Rate</th></tr></thead><tbody>' +
              nights.map(function (n) {
                return '<tr><td>' + fmtDate(n.night, { weekday: 'short' }) + '</td>' + (many ? '<td>' + (n.room.units > 1 ? n.room.units + ' × ' : '') + esc(n.room.name) + '</td>' : '') +

                  '<td class="right num">' + (many ? '' : esc(a.name) + ' · ') + money(a.totalKes) + '</td></tr>';
              }).join('') +
              '</tbody></table></div></section>' +
          '</div>' +
          '<div class="stack">' +
            '<section class="panel panel--sand"><div class="panel__head"><h2>Payment</h2></div><div class="panel__body money num">' +
              '<div><span>Total</span><span>' + money(b.totalKes) + '</span></div>' +

              b.payments.map(function (p) {
                return '<div class="hint"><span>' + esc(p.provider) + (p.receipt ? ' · ' + esc(p.receipt) : '') + '</span><span>' +
                  ({ PAID: 'paid', FLAGGED: 'wrong amount', REFUNDED: 'refunded' }[p.status] || '') + '</span></div>';
              }).join('') +
              '<div class="total"><span>' + (st === 'CANCELLED' || st === 'EXPIRED' ? 'Balance' : st === 'COMPLETED' ? 'Balance, paid at check-out' : 'Balance due at the lodge') + '</span><span class="due">' + (st === 'CANCELLED' || st === 'EXPIRED' ? '—' : money(b.balanceKes)) + '</span></div>' +
            '</div></section>' +

              b.history.map(function (e) { return '<li><div>' + esc(e.what) + '<small>' + fmtDateTime(e.at) + (e.by ? ' · ' + esc(e.by) : '') + '</small></div></li>'; }).join('') +
            '</ol></div></section>' +
            (ro ? '' :

    /* Calendar: rooms free per night for three weeks. Rows = room types, columns = nights. */

      function level(o) {

      }

        '<section class="panel panel--sand"><div class="cal-wrap"><table class="cal"><caption class="sr-only">Rooms free per night, ' + fmtDate(nights[0]) + ' to ' + fmtDate(nights[c.days - 1]) + '</caption><thead>' +

          }).join('') + '</tr></thead><tbody>' +
          c.rooms.map(function (rt) {
            return '<tr><th class="room" scope="row"><b>' + esc(rt.name) + '</b><span>' + plural(rt.units, 'unit') + '</span></th>' + rt.nights.map(function (o) {
              var label = rt.name + ', ' + fmtLong(o.night) + ': ' + o.free + ' of ' + rt.units + ' free';
              return '<td><button class="cell" data-level="' + level(o) + '" data-night="' + o.night + '" data-room="' + rt.id + '" aria-label="' + esc(label) + '">' +
                o.free + '</button></td>';   // just the number: the page says once that it counts free rooms
            }).join('') + '</tr>';
          }).join('') +

        // Legend swatches use the same classes as the cells, so they can never drift apart
        '<div class="legend"><span class="legend__key">Numbers are rooms still free</span><span><i class="sw" data-level="0"></i>Mostly free</span><span><i class="sw" data-level="2"></i>Filling up</span>' +

        '<section class="panel panel--sand" style="margin-top:20px" id="night-panel" aria-live="polite"><div class="panel__head"><h2>Select a night above</h2></div><p class="empty">The guests staying that night will show here.</p></section>';
    }
    function nightPanel(n) {
      return '<div class="panel__head"><h2>' + esc(n.room.name) + ' · ' + fmtLong(n.date) + '</h2><p class="hint">' + n.free + ' of ' + n.room.units + ' free</p></div>' +
        (n.bookings.length ? '<ul class="rows">' + n.bookings.map(function (b) {
          return '<li class="row"><div><div class="row__name"><a href="#/booking/' + b.ref + '">' + guestName(b) + '</a> ' + chip(b.status) + '</div><div class="row__meta">' +
            stayLabel(b) + ' · <span class="ref">' + b.ref + '</span></div></div>' +
            // Always shown, 1 or 6: the number staff scan for
            '<div class="row__rooms"><b>' + b.unitsHere + '</b><span>' + (b.unitsHere === 1 ? 'room' : 'rooms') + '</span></div></li>';
        }).join('') + '</ul>' : '<p class="empty">' + (n.date < TODAY ? 'Nobody stayed' : 'Nobody is staying') + ' in this room type that night.</p>');
    }

    /* Save, at the foot of a room or trip card. Disabled ("No changes") until a field changes:
       then it turns solid ember, so there's no doubt which card has unsaved edits. */
    function saveRow() {
      return '<div class="room-card__save"><p class="hint" data-save-note>No changes</p><button class="btn btn--primary" disabled>Save changes</button></div>';
    }

    /* Rates: everything that has a price, in one place (Oct 2026). Rooms first (price per night,
       units, bookable), then experiences (price per person, seats, departure times, offered).
       Experiences itself is now only who's going on each trip. */
    function viewRooms(d) {
      var ro = readOnly();
      return '<div class="page__head page__head--big"><div><h1 class="page__title">Rates</h1><p class="page__sub page__note">Prices and settings for rooms and experiences. Changes apply to new bookings straight away; guests who have already booked keep the price they were shown.</p></div></div>' +
        '<h2 class="xp-title xp-title--first">Rooms</h2>' +
        '<p class="hint" style="margin:-6px 0 16px">One price per night, all year.</p>' +
        '<div class="stack card-rows">' + d.rooms.map(function (rt) {
          return '<section class="panel"><form class="panel__body room-card" data-room-form="' + rt.id + '" novalidate>' +
            '<div class="room-card__top"><div><h3>' + esc(rt.name) + '</h3><span class="hint">' + esc(rt.kind) + '</span></div>' +
              '<label class="toggle"><input type="checkbox" name="active"' + (rt.active ? ' checked' : '') + (ro ? ' disabled' : '') + ' /> Bookable</label></div>' +
            '<div class="form-grid">' +
              '<div class="field"><label for="base-' + rt.id + '">Price per night (KES)</label><input class="input num" id="base-' + rt.id + '" name="base" inputmode="numeric" value="' + rt.baseRateKes + '"' + (ro ? ' readonly' : '') + ' /></div>' +
              '<div class="field"><label for="units-' + rt.id + '">Units</label><input class="input num" id="units-' + rt.id + '" name="units" type="number" min="0" max="99" value="' + rt.units + '"' + (ro ? ' readonly' : '') + ' /></div>' +
              // Sleeps: guests per room. Changing it only shapes new bookings (how many rooms a party needs)
              '<div class="field"><label for="sleeps-' + rt.id + '">Sleeps (guests per room)</label><input class="input num" id="sleeps-' + rt.id + '" name="sleeps" type="number" min="1" max="20" value="' + rt.sleeps + '"' + (ro ? ' readonly' : '') + ' /></div>' +
            '</div>' + (ro ? '' : saveRow()) + '</form></section>';
        }).join('') + '</div>' +
        '<h2 class="xp-title">Experiences</h2>' +
        '<p class="hint" style="margin:-6px 0 16px">Price per person. Guests already booked keep their departure and price.</p>' +
        tripCards(d.trips, ro);
    }

    /* One card per trip: price, seats per vehicle, departure times, offered or not */
    function tripCards(trips, ro) {
      return '<div class="stack card-rows">' + trips.map(function (t) {
          var hours = t.durationMinutes / 60;
          return '<section class="panel"><form class="panel__body room-card" data-trip-form="' + t.id + '" novalidate>' +
            '<div class="room-card__top"><div><h3>' + esc(t.name) + '</h3><span class="hint">' + (hours % 1 ? t.durationMinutes + ' min' : plural(hours, 'hour')) + '</span></div>' +
              '<label class="toggle"><input type="checkbox" name="active"' + (t.active ? ' checked' : '') + (ro ? ' disabled' : '') + ' /> Offered</label></div>' +
            '<div class="form-grid form-grid--3">' +
              '<div class="field"><label for="tp-' + t.id + '">Per person (KES)</label><input class="input num" id="tp-' + t.id + '" name="price" inputmode="numeric" value="' + t.priceKes + '"' + (ro ? ' readonly' : '') + ' /></div>' +
              '<div class="field"><label for="ts-' + t.id + '">Seats per vehicle</label><input class="input num" id="ts-' + t.id + '" name="seats" type="number" min="1" max="100" value="' + t.seats + '"' + (ro ? ' readonly' : '') + ' /></div>' +
              '<div class="field"><label for="tt-' + t.id + '">Departure times</label><input class="input num" id="tt-' + t.id + '" name="times" value="' + esc(t.departureTimes.join(', ')) + '" aria-describedby="tth-' + t.id + '"' + (ro ? ' readonly' : '') + ' />' +
              '<p class="hint" id="tth-' + t.id + '" style="margin:4px 0 0">24-hour, e.g. 06:30, 14:30</p></div>' +
            '</div>' + (ro ? '' : saveRow()) + '</form></section>';
        }).join('') + '</div>';
    }

    /* Experiences: two weeks of departures (who's going, how many vehicles). Trip prices and times live under Rates. */
    function viewExperiences(d) {
      var ro = readOnly();
      var byDay = [];
      d.departures.forEach(function (dep) {
        var last = byDay[byDay.length - 1];
        if (!last || last.day !== dep.day) byDay.push(last = { day: dep.day, deps: [] });
        last.deps.push(dep);
      });
      var end = addDays(d.from, d.days - 1);
      var list = byDay.length ? byDay.map(function (g) {
        return '<section class="sheet" aria-label="' + esc(fmtLong(g.day)) + '"><div class="list__head"><h2>' + fmtLong(g.day) + '</h2>' +
            (g.day === d.today ? '<p class="hint">Today</p>' : '') + '</div>' +
          g.deps.map(function (dep) {
            return '<div class="dep"><div class="dep__head"><div class="dep__what"><b>' + esc(dep.time) + '</b>' + esc(dep.name) + '</div>' +
              '<div class="dep__count"><strong>' + plural(dep.people, 'person', 'people') + '</strong> · ' + plural(dep.vehicles, 'vehicle') + ' (' + dep.seats + ' seats each)</div></div>' +
              '<ul class="dep__who">' + dep.bookings.map(function (b) {
                return '<li><a href="#/booking/' + b.ref + '">' + guestName(b) + '</a><span>' + plural(b.people, 'person', 'people') + '</span>' +
                  (ro ? '<span>' + esc(b.phone) + '</span>' : '<a href="tel:' + esc(String(b.phone).replace(/\s/g, '')) + '">' + esc(b.phone) + '</a>') +
                  (b.status !== 'CONFIRMED' ? chip(b.status) : '') + '</li>';
              }).join('') + '</ul></div>';
          }).join('') + '</section>';
      }).join('') : '<section class="sheet"><p class="empty">No experiences booked from ' + fmtDate(d.from) + ' to ' + fmtDate(end) + '.</p></section>';

      return '<div class="page__head page__head--big"><div><h1 class="page__title">Experiences</h1><p class="page__sub page__note">Who is going on each trip, two weeks at a time. "Held" means the deposit isn\'t paid yet. Prices and departure times are under Rates.</p></div>' +
          '<div style="display:flex;gap:8px"><button class="btn" data-xp="-14" aria-label="Previous two weeks">←</button><button class="btn" data-xp="0">Today</button><button class="btn" data-xp="14" aria-label="Next two weeks">→</button></div></div>' +
        '<p class="hint" style="margin:0 0 12px">' + fmtDate(d.from) + ' – ' + fmtDate(end, { year: 'numeric' }) + '</p>' +
        '<div class="xp-days" aria-live="polite">' + list + '</div>';
    }


    /* Enquiries: the "Get in touch" form's inbox */
    function viewEnquiries(list) {
      S.newEnq = list.filter(function (e) { return e.status === 'NEW'; }).length;
      var cur = list.find(function (e) { return e.id === S.enquiry; }) || list[0];
      var ro = readOnly();
      function ago(ms) { var h = Math.round((Date.now() - ms) / 36e5); return h < 1 ? 'Just now' : h < 24 ? h + ' h ago' : fmtDateTime(ms).split(',')[0]; }
      return '<div class="page__head page__head--big"><div><h1 class="page__title">Enquiries</h1><p class="page__sub page__note">Messages from the website\'s "Get in touch" form.</p></div></div>' +
        (list.length ? '<section class="panel panel--sand inbox' + (S.reading ? ' reading' : '') + '" id="inbox"><ul class="inbox__list" aria-label="Enquiries">' + list.map(function (e) {
          return '<li><button class="inbox__item' + (e.status === 'NEW' ? ' unread' : '') + '" data-enq="' + e.id + '" aria-current="' + (cur && e.id === cur.id) + '">' +
            '<div class="inbox__top"><b>' + esc(e.firstName + ' ' + e.lastName) + '</b><small>' + ago(e.createdAt) + '</small></div>' +
            '<p>' + (e.subject ? esc(e.subject) + ' · ' : '') + esc(e.message) + '</p></button></li>';
        }).join('') + '</ul>' +
        '<article class="inbox__read" aria-live="polite">' +
          '<button class="btn btn--small btn--ghost back-to-list" data-back="1" style="padding:0;margin-bottom:12px">← All enquiries</button>' +
          '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2>' + esc(cur.subject || 'Enquiry') + '</h2>' +
            '<p class="inbox__from">' + esc(cur.firstName + ' ' + cur.lastName) + ' · ' + fmtDateTime(cur.createdAt) + '</p></div><div>' + chip(cur.status) + '</div></div>' +
          '<dl class="kv" style="margin-top:20px">' +
            '<dt>Email</dt><dd>' + (ro ? esc(cur.email) : '<a href="mailto:' + esc(cur.email) + '">' + esc(cur.email) + '</a>') + '</dd>' +
            (cur.phone ? '<dt>Phone</dt><dd>' + (ro ? esc(cur.phone) : '<a href="tel:' + esc(cur.phone.replace(/\s/g, '')) + '">' + esc(cur.phone) + '</a>') + '</dd>' : '') +
            (cur.checkIn && cur.checkOut ? '<dt>Dates</dt><dd>' + fmtDate(cur.checkIn) + ' – ' + fmtDate(cur.checkOut) + ' (' + plural(daysBetween(cur.checkIn, cur.checkOut), 'night') + ')</dd>' : '') +
            (cur.guests ? '<dt>Guests</dt><dd>' + cur.guests + '</dd>' : '') +
          '</dl>' +
          '<div class="message">' + esc(cur.message) + '</div>' +
          (ro ? '' : '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            '<a class="btn btn--primary btn--caps" href="mailto:' + esc(cur.email) + '?subject=' + encodeURIComponent('Re: ' + (cur.subject || 'your enquiry') + ' · Safari Ember') + '" aria-label="Reply by email">Reply</a>' +
            (cur.status === 'NEW' ? '<button class="btn btn--caps" data-act="enquiry" data-status="HANDLED" data-id="' + cur.id + '">Mark as handled</button>' : '<button class="btn btn--caps" data-act="enquiry" data-status="NEW" data-id="' + cur.id + '">Mark as new</button>') +
          '</div>') + '</article></section>'
        : '<section class="panel panel--sand"><p class="empty">No enquiries yet. Messages from the site\'s "Get in touch" form arrive here.</p></section>');
    }

    /* ── ROUTER ───────────────────────────────────────────────────────────────────────────── */

    var app = document.getElementById('app');
    var holdTick, renderSeq = 0, lastRoute = '';

    // What each screen needs from the API, then how to draw it
    var SCREENS = {
      // The charts come from their own endpoint; if it fails, Today still shows (without them)
      today: { title: 'Today', view: viewToday, load: function () {
        return Promise.all([api('/today'), api('/stats').catch(function () { return null; })])
          .then(function (r) { r[0].stats = r[1]; return r[0]; });
      } },
      bookings: { title: 'Bookings', view: viewBookings, load: function () {
        return Promise.all([api(bookingsQuery()), S.rooms ? Promise.resolve({ rooms: S.rooms }) : api('/rooms')])
          .then(function (r) { S.rooms = r[1].rooms; return { bookings: r[0].bookings, refundsOwed: r[0].refundsOwed, rooms: S.rooms }; });
      } },
      booking: { title: 'Booking', nav: 'bookings', view: viewBooking, load: function (ref) {
        return api('/bookings/' + encodeURIComponent(ref)).then(function (r) { return r.booking; });
      } },
      calendar: { title: 'Calendar', load: function () { return api('/calendar?' + qs({ from: S.calStart })); }, view: viewCalendar },
      experiences: { title: 'Experiences', load: function () { return api('/experiences?' + qs({ from: S.xpStart })).then(function (d) { S.trips = d.trips; return d; }); }, view: viewExperiences },
      rooms: { title: 'Rates', view: viewRooms, load: function () {
        // The trips come with the departures list; the departures are simply not shown here
        return Promise.all([api('/rooms'), api('/experiences')]).then(function (r) {
          S.rooms = r[0].rooms; S.trips = r[1].trips;
          return { rooms: r[0].rooms, trips: r[1].trips };
        });
      } },
      enquiries: { title: 'Enquiries', load: function () { return api('/enquiries').then(function (r) { return r.enquiries; }); }, view: viewEnquiries },
    };

    /** A request was refused because the session ended or the code is still needed: back to sign-in. */
    function signedOut(e) {
      if (e.status !== 401) return false;
      if (e.needsTotp && S.me) { S.me.needsTotp = true; S.stage = 'code'; }
      else { S.me = null; S.stage = 'password'; toast(e.message); }
      location.hash = '#/login'; if (location.hash === '#/login') render();
      return true;
    }

    function render(opts) {
      var seq = ++renderSeq;
      var hash = location.hash.replace(/^#\/?/, '') || 'today';
      var parts = hash.split('/');
      if (!S.checked) return;                                   // still asking the API who we are
      var signedIn = S.me && !S.me.needsTotp;
      if (!signedIn && parts[0] !== 'login') { location.replace('#/login'); return; }
      if (signedIn && parts[0] === 'login') { location.replace('#/today'); return; }
      clearInterval(holdTick);

      if (parts[0] === 'login') {
        document.title = 'Sign in · Safari Ember Admin';
        app.innerHTML = viewLogin(opts && opts.error); bindLogin(); return;
      }
      var screen = SCREENS[parts[0]] || SCREENS.today;
      document.title = screen.title + ' · Safari Ember Admin';
      var active = screen.nav || parts[0];
      // A new screen shows "Loading…" at once; a redraw of the same screen (after an action)
      // keeps the old content until the new arrives, so nothing jumps.
      var routeChanged = hash !== lastRoute; lastRoute = hash;
      if (routeChanged) { app.innerHTML = shell(active, '<p class="loading" role="status">Loading…</p>'); bindShell(); }

      return screen.load(decodeURIComponent(parts[1] || '')).then(function (data) {
        if (seq !== renderSeq) return;                          // the user moved on meanwhile
        if (parts[0] === 'booking' && !data) throw Object.assign(new Error('Booking not found.'), { status: 404 });
        app.innerHTML = shell(active, screen.view(data));
        bindShell(); bindCharts();
        // Move focus to the new page for keyboard and screen-reader users, like a page load would
        if (routeChanged && window.__routed) document.getElementById('main').focus({ preventScroll: true });
        window.__routed = true;
        if (routeChanged) window.scrollTo(0, 0);
        tickHolds(); holdTick = setInterval(tickHolds, 1000);
      }).catch(function (e) {
        if (seq !== renderSeq || signedOut(e)) return;
        var main = document.getElementById('main');
        if (main) main.innerHTML = problemHtml(e);
        var retry = document.getElementById('retry'); if (retry) retry.onclick = function () { lastRoute = ''; render(); };
      });
    }

    function tickHolds() {
      document.querySelectorAll('.timer[data-expires]').forEach(function (el) {
        var left = Math.max(0, Number(el.dataset.expires) - Date.now());
        var m = Math.floor(left / 6e4), s = Math.floor(left % 6e4 / 1000);
        el.textContent = left ? m + ':' + String(s).padStart(2, '0') + ' left' : 'Released';
      });
    }

    /* ── EVENTS ───────────────────────────────────────────────────────────────────────────── */

    function busy(btn, on, label) {
      if (!btn) return;
      if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || 'Working…'; btn.disabled = true; }
      else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; }
    }

    function bindLogin() {
      var f = document.getElementById('f-login'), c = document.getElementById('f-code');
      if (f) {
        document.getElementById('email').focus();
        f.addEventListener('submit', function (e) {
          e.preventDefault();
          var btn = f.querySelector('button'); busy(btn, true, 'Signing in…');
          api('/login', { method: 'POST', body: { email: document.getElementById('email').value, password: document.getElementById('pw').value } })
            .then(function (r) {
              S.me = r.admin;
              if (S.me.needsTotp) { S.stage = 'code'; render(); document.getElementById('code').focus(); }
              else { S.stage = 'password'; location.hash = '#/today'; }
            })
            .catch(function (err) { render({ error: err.message }); var pw = document.getElementById('pw'); if (pw) pw.focus(); });
        });
      }
      if (c) {
        c.addEventListener('submit', function (e) {
          e.preventDefault();
          var v = document.getElementById('code').value.trim();
          if (!/^\d{6}$/.test(v)) { render({ error: 'Enter the 6 digits from your authenticator app.' }); document.getElementById('code').focus(); return; }
          var btn = c.querySelector('button'); busy(btn, true, 'Checking…');
          api('/login/code', { method: 'POST', body: { code: v } })
            .then(function (r) { S.me = r.admin; S.stage = 'password'; location.hash = '#/today'; })
            .catch(function (err) {
              if (err.status === 401 && !S.me) return signedOut(err);
              render({ error: err.message }); document.getElementById('code').focus();
            });
        });
        document.getElementById('restart').onclick = function () {
          api('/logout', { method: 'POST' }).catch(function () {}).then(function () { S.me = null; S.stage = 'password'; render(); });
        };
      }
    }

    /** After an action: toast, then redraw the current screen from the API (the source of truth). */
    function refresh(msg) { if (msg) toast(msg); render(); }
    function failed(e) { if (!signedOut(e)) toast(e.message); }

    var searchTimer;
    function bindShell() {
      var shellEl = document.getElementById('shell'), burger = document.getElementById('burger');
      function setNav(open) {
        shellEl.classList.toggle('nav-open', open); burger.setAttribute('aria-expanded', open);
        var scrim = document.querySelector('.scrim');
        if (open && !scrim) { scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.onclick = function () { setNav(false); }; shellEl.appendChild(scrim); }
        if (!open && scrim) scrim.remove();
        if (open) document.querySelector('.nav a').focus();
      }
      burger.onclick = function () { setNav(!shellEl.classList.contains('nav-open')); };
      // Esc closes the phone menu. Assigned (not added), so re-rendering never stacks up listeners.
      document.onkeydown = function (e) { if (e.key === 'Escape' && shellEl.classList.contains('nav-open')) { setNav(false); burger.focus(); } };
      document.getElementById('signout').onclick = function () {
        api('/logout', { method: 'POST' }).catch(function () {}).then(function () {
          // Forget everything the last person saw: messages, filters, cached rooms
          document.getElementById('toast').hidden = true;
          S = Object.assign(S, { me: null, stage: 'password', bookingsFilter: 'upcoming', bookingsRoom: 'all', bookingsQ: '', enquiry: null, reading: false, newEnq: 0, rooms: null });
          location.hash = '#/login';
        });
      };

      // Bookings table: search (asks the API once typing pauses), filters, whole-row click
      var q = document.getElementById('q');
      if (q) {
        function reload() {
          api(bookingsQuery()).then(function (r) { var rows = document.getElementById('rows'); if (rows) rows.innerHTML = bookingRowsHtml(r.bookings); }, failed);
        }
        q.addEventListener('input', function () { S.bookingsQ = q.value; clearTimeout(searchTimer); searchTimer = setTimeout(reload, 250); });
        document.getElementById('room').onchange = function (e) { S.bookingsRoom = e.target.value; reload(); };
        document.querySelectorAll('[data-filter]').forEach(function (b) {
          b.onclick = function () { S.bookingsFilter = b.dataset.filter;
            document.querySelectorAll('[data-filter]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
            reload(); };
        });
        document.getElementById('rows').addEventListener('click', function (e) {
          var tr = e.target.closest('tr[data-href]'); if (tr && !e.target.closest('a')) location.hash = tr.dataset.href;
        });
      }

      // Calendar
      document.querySelectorAll('[data-cal]').forEach(function (b) {
        b.onclick = function () { var n = Number(b.dataset.cal); S.calStart = n ? addDays(S.calStart, n) : TODAY; refresh(); };
      });
      document.querySelectorAll('.cell').forEach(function (c) {
        c.onclick = function () {
          var panel = document.getElementById('night-panel');
          api('/calendar/night?' + qs({ date: c.dataset.night, room: c.dataset.room }))
            .then(function (n) { panel.innerHTML = nightPanel(n); }, failed);
        };
      });

      // Enquiries
      document.querySelectorAll('[data-enq]').forEach(function (b) {
        b.onclick = function () { S.enquiry = Number(b.dataset.enq); S.reading = true; refresh(); };
      });
      var back = document.querySelector('[data-back]'); if (back) back.onclick = function () { S.reading = false; refresh(); };

      // Experiences: two weeks back / forward, and trip settings (send only what changed)
      document.querySelectorAll('[data-xp]').forEach(function (b) {
        b.onclick = function () { var n = Number(b.dataset.xp); S.xpStart = n ? addDays(S.xpStart, n) : TODAY; refresh(); };
      });
      document.querySelectorAll('[data-trip-form]').forEach(function (f) {
        f.onsubmit = function (e) {
          e.preventDefault();
          var id = Number(f.dataset.tripForm), change = {};
          var t = S.trips.find(function (x) { return x.id === id; });
          var price = Number(String(f.price.value).replace(/[^\d]/g, '')), seats = Number(f.seats.value);
          var times = f.times.value.split(/[,\s]+/).filter(Boolean).map(function (x) { return /^\d:\d\d$/.test(x) ? '0' + x : x; });
          if (!(price >= 100)) { toast('The price per person should be at least KES 100.'); f.price.focus(); return; }
          if (!(seats >= 1 && seats <= 100 && Math.floor(seats) === seats)) { toast('Seats must be a whole number from 1 to 100.'); f.seats.focus(); return; }
          if (!times.length || times.some(function (x) { return !/^([01]\d|2[0-3]):[0-5]\d$/.test(x); })) { toast('Write departure times as HH:MM, e.g. 06:30, 14:30.'); f.times.focus(); return; }
          if (new Set(times).size !== times.length) { toast('A departure time is listed twice.'); f.times.focus(); return; }
          times.sort();
          if (price !== t.priceKes) change.priceKes = price;
          if (seats !== t.seats) change.seats = seats;
          if (times.join() !== t.departureTimes.join()) change.departureTimes = times;
          if (f.active.checked !== t.active) change.active = f.active.checked;
          if (!Object.keys(change).length) { toast('Nothing to save.'); return; }
          var btn = f.querySelector('button'); busy(btn, true, 'Saving…');
          api('/experiences/' + id, { method: 'PATCH', body: change }).then(function (r) {
            refresh(t.name + ' saved.' + (r.offSchedule ? ' ' + plural(r.offSchedule, 'booking') + ' already booked on a time or day it no longer runs: they keep their slot, so contact those guests.' : ''));
          }, function (err) { busy(btn, false); failed(err); });
        };
      });

      // Room and trip cards: Save wakes up when a field differs from what was loaded
      document.querySelectorAll('[data-room-form], [data-trip-form]').forEach(function (f) {
        var btn = f.querySelector('.room-card__save button'), note = f.querySelector('[data-save-note]');
        if (!btn) return;
        function snap() { return Array.prototype.map.call(f.elements, function (el) { return el.type === 'checkbox' ? el.checked : el.value; }).join('|'); }
        var start = snap();
        function check() { var dirty = snap() !== start; btn.disabled = !dirty; note.textContent = dirty ? 'Unsaved changes' : 'No changes'; note.classList.toggle('is-dirty', dirty); }
        f.addEventListener('input', check); f.addEventListener('change', check);
      });

      // Rooms: send only what changed
      document.querySelectorAll('[data-room-form]').forEach(function (f) {
        f.onsubmit = function (e) {
          e.preventDefault();
          var rt = S.rooms.find(function (r) { return r.id === Number(f.dataset.roomForm); });
          var base = Number(String(f.base.value).replace(/[^\d]/g, '')), units = Number(f.units.value), sleeps = Number(f.sleeps.value), change = {};
          if (!(base >= 1000)) { toast('The price per night should be at least KES 1,000.'); f.base.focus(); return; }
          if (!(units >= 0 && units <= 99 && Math.floor(units) === units)) { toast('Units must be a whole number from 0 to 99.'); f.units.focus(); return; }
          if (!(sleeps >= 1 && sleeps <= 20 && Math.floor(sleeps) === sleeps)) { toast('Sleeps must be a whole number from 1 to 20.'); f.sleeps.focus(); return; }
          if (base !== rt.baseRateKes) change.baseRateKes = base;
          if (units !== rt.units) change.units = units;
          if (sleeps !== rt.sleeps) change.sleeps = sleeps;
          if (f.active.checked !== rt.active) change.active = f.active.checked;
          if (!Object.keys(change).length) { toast('Nothing to save.'); return; }
          var btn = f.querySelector('button'); busy(btn, true, 'Saving…');
          api('/rooms/' + rt.id, { method: 'PATCH', body: change })
            .then(function () { refresh(rt.name + ' saved. New bookings use the new settings.'); }, function (err) { busy(btn, false); failed(err); });
        };
      });
      // Buttons with data-act, anywhere on the page
      document.getElementById('main').addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]'); if (!b) return;
        var ref = b.dataset.ref;
        switch (b.dataset.act) {
          case 'showheld': S.bookingsFilter = 'held'; break;   // the link itself then opens #/bookings
          case 'showrefunds': S.bookingsFilter = 'refunds'; break;
          case 'refundsent':
            confirmDialog({ title: 'Mark the refund as sent?', body: 'Only once the money has gone back to the guest from M-Pesa or Paystack. This clears it from Today and the Refunds list.', ok: 'Mark refund sent',
              onOk: function () { api('/bookings/' + ref + '/refund-sent', { method: 'POST' }).then(function () { refresh('Refund marked as sent.'); }, failed); } });
            break;
          case 'checkin':
            busy(b, true, 'Checking in…');
            api('/bookings/' + ref + '/check-in', { method: 'POST' })
              .then(function (r) { refresh(r.booking.firstName + ' ' + r.booking.lastName + ' checked in. Balance due ' + money(r.booking.balanceKes) + '.'); }, function (err) { busy(b, false); failed(err); });
            break;
          case 'checkout':
            confirmDialog({ title: 'Check out ' + b.dataset.name + '?', body: 'Make sure the balance of ' + money(Number(b.dataset.due)) + ' has been paid at the desk.', ok: 'Check out',
              onOk: function () {
                api('/bookings/' + ref + '/check-out', { method: 'POST' }).then(function () { refresh('Checked out. Room ready for housekeeping.'); }, failed);
              } });
            break;
          case 'cancel':
            var paid = Number(b.dataset.paid);
            confirmDialog({ title: 'Cancel ' + ref + '?', danger: true, ok: 'Cancel booking', field: 'Reason (the guest sees this on their booking page)',
              body: paid ? 'The rooms are released straight away. The deposit of ' + money(paid) + ' is not refunded automatically: refund it from M-Pesa or Paystack if your policy allows.' : 'The hold is released straight away. No payment was taken.',
              onOk: function (reason) {
                if (!reason || reason.length < 3) { toast('Give the guest a short reason.'); return; }
                api('/bookings/' + ref + '/cancel', { method: 'POST', body: { reason: reason } }).then(function () { refresh(ref + ' cancelled.'); }, failed);
              } });
            break;
          case 'copylink':
            api('/bookings/' + ref + '/link').then(function (r) {
              return (navigator.clipboard ? navigator.clipboard.writeText(r.url) : Promise.reject()).then(function () { toast('Guest link copied.'); }, function () { toast(r.url); });
            }, failed);
            break;
          case 'enquiry':
            api('/enquiries/' + b.dataset.id + '/status', { method: 'POST', body: { status: b.dataset.status } })
              .then(function () { refresh(b.dataset.status === 'HANDLED' ? 'Marked as handled.' : 'Marked as new.'); }, failed);
            break;
        }
      });
    }

    window.addEventListener('hashchange', function () { render(); });

    // Start: ask the API who is signed in (the cookie, if any, comes along by itself).
    api('/me').then(function (r) {
      S.me = r.admin;
      if (S.me.needsTotp) S.stage = 'code';
    }, function () { S.me = null; }).then(function () { S.checked = true; render(); });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The admin area must never show up in search results. (The real protection is the sign-in on
       the server; this only keeps it out of Google.) -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Safari Ember · Admin</title>
  <link rel="icon" href="mark.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Same fonts as the public site: Playfair for headings, Jost for everything you read and click -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       SAFARI EMBER ADMIN · DESIGN PROTOTYPE
       The lodge's back office: the same warm black and ember as the site, but calmer and denser,
       because staff scan it all day. Plain sans-serif for data, serif only for page titles,
       no decorative motion, and every colour checked for contrast.

       Everything below runs on SAMPLE DATA (the DATA block in the script). When the API exists
       (Phase 5), the screens stay the same and only the data source changes.
    ========================================================================== */
    :root {
      /* Surfaces, darkest to lightest */
      --bg:        #0b0907;
      --panel:     #13100c;
      --panel-2:   #1a150f;
      --panel-3:   #241c14;
      --line:      rgba(200, 120, 42, .16);
      --line-2:    rgba(200, 120, 42, .32);

      /* Text: all at least 4.5:1 on --panel */
      --text:      #f5e8d0;
      --muted:     #c4a882;
      --dim:       #a99379;

      /* Brand */
      --ember:     #c8782a;
      --ember-hi:  #e8954a;

      /* Fields: the site's sand */
      --field:     #dcd2c3;
      --field-ink: #1c1610;
      /* The same sand, used in the admin for DATA: dark ink on sand, like paper on a desk.
         Today's Arriving and Leaving sheets, the Bookings list, a booking's details, closure
         clashes and today's calendar column. Alerts (holds, enquiries, a guest's request) are
         NOT sand: they're dark with an ember edge and an ember headline label. */
      --sand-ember: #8a3f0e;   /* ember text on sand: 5.0:1 (AA) */

      /* Status colours. Never colour alone: every status also has a word. */
      --st-held:      #f0b070;  --st-held-bg:      rgba(232, 149, 74, .14);
      --st-ok:        #9fd3a0;  --st-ok-bg:        rgba(120, 190, 120, .13);
      --st-inhouse:   #9cc8ea;  --st-inhouse-bg:   rgba(120, 170, 220, .13);
      --st-done:      #c2b5a5;  --st-done-bg:      rgba(255, 255, 255, .06);
      --st-bad:       #f0a090;  --st-bad-bg:       rgba(220, 90, 70, .14);

      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;

      --radius: 0;   /* square corners throughout, like the public site */
      --side-w: 232px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--ember-hi); }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1, h2, h3 { margin: 0; font-weight: 400; }
    /* One clear focus ring everywhere, for keyboard users */
    :focus-visible { outline: 2px solid var(--ember-hi); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .num { font-variant-numeric: tabular-nums; }     /* figures line up in columns */

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 0 16px; border-radius: 0;
      border: 1px solid var(--line-2); background: transparent; color: var(--text);
      font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .btn:hover { border-color: var(--ember); background: var(--panel-2); }
    .btn--primary { background: var(--ember); border-color: var(--ember); color: #120c06; }
    .btn--primary:hover { background: var(--ember-hi); border-color: var(--ember-hi); }
    .btn--danger { border-color: rgba(240, 160, 144, .45); color: var(--st-bad); }
    .btn--danger:hover { background: var(--st-bad-bg); border-color: var(--st-bad); }
    .btn--small { min-height: 32px; padding: 0 12px; font-size: 13px; }
    .btn--ghost { border-color: transparent; color: var(--muted); }
    /* Capitals like the site's buttons, done in CSS so screen readers still read words, not letters */
    .btn--caps { text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 600; padding: 0 20px; }
    .btn--ghost:hover { color: var(--text); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }

    /* ── Status chips ─────────────────────────────────────────────────────── */
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 0;
            font-size: 12.5px; font-weight: 500; white-space: nowrap; }
    .chip::before { content: ''; width: 6px; height: 6px; border-radius: 0; background: currentColor; }
    .chip--HELD      { color: var(--st-held);    background: var(--st-held-bg); }
    .chip--CONFIRMED { color: var(--st-ok);      background: var(--st-ok-bg); }
    .chip--INHOUSE   { color: var(--st-inhouse); background: var(--st-inhouse-bg); }
    .chip--COMPLETED { color: var(--st-done);    background: var(--st-done-bg); }
    .chip--EXPIRED   { color: var(--st-done);    background: var(--st-done-bg); }
    .chip--CANCELLED { color: var(--st-bad);     background: var(--st-bad-bg); }
    .chip--NEW       { color: var(--st-held);    background: var(--st-held-bg); }
    .chip--HANDLED   { color: var(--st-done);    background: var(--st-done-bg); }

    /* ── Forms ────────────────────────────────────────────────────────────── */
    .field { display: grid; gap: 6px; }
    .field label, .label { font-size: 13px; color: var(--muted); font-weight: 500; }
    /* Fields: the site's sand with dark text (as on Get in Touch and the booking page), so the
       places you type stand out from the dark panels. color-scheme: light gives date pickers and
       dropdowns their light versions to match. */
    .input, select.input, textarea.input {
      width: 100%; min-height: 42px; padding: 9px 12px; border-radius: 0;
      background: var(--field); border: 1px solid var(--field); color: var(--field-ink); color-scheme: light;
    }
    .input::placeholder { color: #5e4a38; opacity: 1; }            /* 5.6:1 on the sand */
    .input:focus { border-color: #080705; outline: none; box-shadow: inset 0 0 0 1px #080705; }
    select.input option { background: #fffaf2; color: var(--field-ink); }
    /* Browser autofill paints its own colour: keep the sand and the dark text */
    .input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px var(--field) inset; -webkit-text-fill-color: var(--field-ink); caret-color: var(--field-ink); }
    .hint { font-size: 13px; color: var(--dim); }

    /* ==========================================================================
       SIGN-IN (before the app shell)
    ========================================================================== */
    .auth { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    .auth__card { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 0; padding: 36px 32px; }
    .auth__brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; text-align: center; }
    .auth__brand img { width: 64px; height: 64px; }
    .auth__brand h1 { font-family: var(--serif); font-size: 22px; text-transform: uppercase; letter-spacing: .18em; color: var(--ember); }
    .auth__brand p { margin: 0; color: var(--muted); font-size: 14px; }
    .auth form { display: grid; gap: 18px; }
    .code-input { letter-spacing: .5em; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
    .auth__foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--dim); }
    .auth__foot button { background: none; border: 0; color: var(--ember-hi); cursor: pointer; text-decoration: underline; padding: 4px; }

    /* ==========================================================================
       APP SHELL: sidebar + main. On phones the sidebar becomes a drawer.
    ========================================================================== */
    .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; }
    .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
            background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; }
    .side__brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; text-decoration: none; color: var(--text); }
    .side__brand img { width: 34px; height: 34px; }
    .side__brand b { display: block; font-family: var(--serif); font-weight: 400; font-size: 15px; line-height: 1.1;
                     text-transform: uppercase; letter-spacing: .14em; color: var(--ember); }   /* the logo's name, like the site */
    .side__brand small { color: var(--dim); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    .nav { display: grid; gap: 2px; }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 0;
             color: var(--muted); text-decoration: none; font-weight: 500; }
    .nav a:hover { background: var(--panel-2); color: var(--text); }
    .nav a[aria-current="page"] { background: var(--panel-3); color: var(--text); box-shadow: inset 2px 0 0 var(--ember); }
    .nav svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    /* A round count, like every other notification. 22px circle for 1-2 digits; wider numbers stretch to a pill */
    .nav .count { margin-left: auto; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px;
                  border-radius: 11px; background: var(--ember); color: #120c06; font-size: 12px; font-weight: 600; line-height: 1; }
    .side__foot { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 8px 0; display: grid; gap: 10px; }
    .who { display: flex; align-items: center; gap: 10px; }
    .who__avatar { width: 32px; height: 32px; border-radius: 0; background: var(--panel-3); display: grid; place-items: center;
                   color: var(--ember-hi); font-weight: 600; font-size: 13px; }
    .who b { display: block; font-weight: 500; font-size: 14px; }
    .who small { color: var(--dim); font-size: 12.5px; }
    .proto-note { font-size: 12px; color: var(--dim); line-height: 1.4; }

    .main { min-width: 0; }
    .topbar { display: none; }
    .page { padding: 32px 36px 64px; max-width: 1240px; }
    .page__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .page__title { font-family: var(--serif); font-size: 30px; line-height: 1.15; }
    .page__sub { margin: 6px 0 0; color: var(--muted); }
    .crumb { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 10px; }
    .crumb:hover { color: var(--text); }

    /* ── Panels and lists ─────────────────────────────────────────────────── */
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel__head h2 { font-family: var(--sans); font-size: 14px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ember-hi); }   /* the site's headline tag */
    .panel__head .hint { margin: 0; }
    .panel__body { padding: 18px; }
    .empty { padding: 22px 18px; color: var(--dim); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .stack { display: grid; gap: 20px; }

    /* Today (option A): the day's numbers on one line, notifications, then the two lists on sand.
       No boxes: spacing and thin rules do the separating, so the names and buttons stand out. */
    /* Today: big, readable from across the reception desk */
    .page__head--today .page__title { font-size: 46px; }
    .page__head--today .page__sub { font-size: 21px; color: var(--text); margin-top: 8px; }
    .stats { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px 44px; padding: 22px 0; margin-bottom: 22px;   /* labels share one baseline, whatever sits above */
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .stat { display: grid; gap: 6px; color: inherit; text-decoration: none; }
    .stat__n { font-family: var(--serif); font-size: 46px; line-height: 1; color: var(--text); }
    .stat__n small { font-size: 22px; color: var(--muted); }
    /* The site's headline tag: small capitals, wide letter-spacing, ember */
    .stat__k { font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    a.stat:hover .stat__k { color: var(--ember-hi); }
    /* Notifications (holds, enquiries): an ember circle with the count and the site's headline
       tag beside it. Not sand: sand is for sheets of information; these are alerts. The circle is
       the one round shape on purpose, because a round count reads as "new" everywhere. */
    .notes { display: flex; flex-wrap: wrap; gap: 16px 48px; margin-bottom: 28px; }
    .notice { display: flex; align-items: center; gap: 16px; color: inherit; text-decoration: none; }
    .notice__n { display: grid; place-items: center; flex: none; width: 60px; height: 60px; border-radius: 50%;
      background: var(--ember); color: #120c06; font-weight: 600; font-size: 28px; font-variant-numeric: tabular-nums; }
    .notice__k { display: block; font-size: 15px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ember-hi); }
    .notice__s { display: block; font-size: 15px; color: var(--muted); margin-top: 3px; }
    .notice__s .timer { font-size: 15px; }
    .notice:hover .notice__k { color: var(--text); }
    .grid-2--wide { gap: 24px; align-items: start; }
    /* Arriving and Leaving on sand, like paper on the desk: dark ink, maximum contrast (12:1) */
    .sheet { background: var(--field); color: var(--field-ink); padding: 18px 22px 8px; border-left: 3px solid var(--ember); }
    .list__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .list__head h2 { font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #522b0a; }
    .sheet .hint { color: #5a4632; font-size: 14px; }
    .sheet .rows { border: 0; }
    .sheet .row { padding: 14px 0; border-top: 1px solid rgba(28, 22, 16, .16); }
    .sheet .row__name { font-size: 17px; }
    .sheet .row__name a { color: var(--field-ink); }
    .sheet .row__name a:hover { color: var(--sand-ember); }
    .sheet .row__meta { font-size: 15px; color: #5a4632; }
    .sheet .empty { color: #5a4632; padding: 14px 0 18px; }
    .row__note { font-size: 14px; color: var(--sand-ember); margin-top: 3px; font-weight: 500; }
    .row.is-done .row__name a { color: #5c4c3d; text-decoration: line-through; text-decoration-color: rgba(28, 22, 16, .45); }
    .done-mark { color: #24592c; font-size: 15px; font-weight: 600; white-space: nowrap; }

    /* A row in a "today" list: who, what, action */
    .rows { list-style: none; margin: 0; padding: 0; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row__name { font-weight: 500; }
    .row__name a { color: var(--text); text-decoration: none; }
    .row__name a:hover { color: var(--ember-hi); text-decoration: underline; }
    .row__meta { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .row__actions { display: flex; gap: 8px; align-items: center; }
    .timer { font-variant-numeric: tabular-nums; color: var(--st-held); font-weight: 500; font-size: 14px; }

    /* ── Tables ───────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    caption { text-align: left; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    td.right, th.right { text-align: right; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.clickable { cursor: pointer; }
    tbody tr.clickable:hover { background: var(--panel-2); }
    .ref { font-variant-numeric: tabular-nums; letter-spacing: .03em; font-weight: 500; white-space: nowrap; }   /* SE-XXXXXX never splits */
    td a.ref { color: var(--text); text-decoration: none; }
    td a.ref:hover { color: var(--ember-hi); text-decoration: underline; }
    .sub { display: block; font-size: 13px; color: var(--dim); }

    /* The bookings list on sand, like the Today sheets: dark ink on paper for reading data.
       (The filters bar above stays on the dark panel: its fields are sand already.) */
    .table-wrap--sand { background: var(--field); color: var(--field-ink); }
    .table-wrap--sand th { color: #522b0a; font-weight: 600; border-bottom: 1px solid rgba(28, 22, 16, .28); }
    .table-wrap--sand td { border-bottom: 1px solid rgba(28, 22, 16, .14); }
    .table-wrap--sand tbody tr.clickable:hover { background: rgba(28, 22, 16, .06); }
    .table-wrap--sand td a.ref { color: var(--field-ink); }
    .table-wrap--sand td a.ref:hover { color: var(--sand-ember); }
    .table-wrap--sand .sub, .table-wrap--sand .empty { color: #5a4632; }
    /* Status words on sand: no dot, darker colours made for the light background (all 4.6:1 or more) */
    .table-wrap--sand .chip, .panel--sand .chip { font-weight: 600; padding: 3px 10px; }
    .table-wrap--sand .chip::before, .panel--sand .chip::before { display: none; }
    .table-wrap--sand .chip--CONFIRMED, .panel--sand .chip--CONFIRMED { color: #1b5023; background: rgba(36, 120, 50, .16); }
    .table-wrap--sand .chip--HELD, .panel--sand .chip--HELD      { color: #7a3a0c; background: rgba(200, 120, 42, .22); }
    .table-wrap--sand .chip--INHOUSE, .panel--sand .chip--INHOUSE   { color: #1d4a72; background: rgba(40, 100, 160, .16); }
    .table-wrap--sand .chip--COMPLETED, .table-wrap--sand .chip--EXPIRED, .panel--sand .chip--COMPLETED, .panel--sand .chip--EXPIRED { color: #4f4135; background: rgba(28, 22, 16, .08); }
    .panel--sand .chip--NEW { color: #7a3a0c; background: rgba(200, 120, 42, .22); }
    .panel--sand .chip--HANDLED { color: #4f4135; background: rgba(28, 22, 16, .08); }
    /* Buttons on sand: dark ink outlines (the dark-page ones have cream text) */
    .panel--sand .btn:not(.btn--primary) { color: var(--field-ink); border-color: rgba(28, 22, 16, .35); background: transparent; }
    .panel--sand .btn:not(.btn--primary):hover { background: rgba(28, 22, 16, .07); border-color: rgba(28, 22, 16, .6); }
    /* .btn.btn--x matches the rule above's strength (0,3,0) and comes later, so it wins: no !important */
    .panel--sand .btn.btn--danger { color: #8a2418; border-color: rgba(138, 36, 24, .5); }
    .panel--sand .btn.btn--danger:hover { background: rgba(190, 60, 40, .12); border-color: #8a2418; }
    .panel--sand .btn.btn--ghost { border-color: transparent; color: #5a4632; }
    .panel--sand .btn.btn--primary { color: #120c06; }   /* a link styled as a button (Reply) must not take the sand link colour */
    .table-wrap--sand .chip--CANCELLED, .panel--sand .chip--CANCELLED { color: #8a2418; background: rgba(190, 60, 40, .15); }

    /* Filters bar above the bookings table */
    .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .filters .input { width: auto; min-height: 38px; }
    .filters .search { flex: 1 1 240px; }
    .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 0; overflow: hidden; flex-wrap: wrap; }
    .seg button { background: none; border: 0; padding: 8px 12px; color: var(--muted); cursor: pointer; font-size: 13.5px; font-weight: 500; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: var(--panel-3); color: var(--text); }

    /* ── Booking detail ───────────────────────────────────────────────────── */
    .detail { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
    /* One booking: the same rules as Today and Bookings. A big top; data on sand with headline
       tags; the guest's request as a notification; the balance due as the one thing that shouts. */
    .page__head--big .page__title { font-size: 46px; }
    .page__head--big .page__sub { display: flex; align-items: center; gap: 14px; font-size: 19px; color: var(--text); margin-top: 8px; }
    .page__head--big .chip { font-size: 14px; font-weight: 600; padding: 4px 12px; }
    .page__head--big .chip::before { display: none; }
    .request { background: var(--panel-2); border-left: 3px solid var(--ember); padding: 14px 18px; margin: 0 0 20px; }
    .request__k { display: block; font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ember-hi); }
    .request p { margin: 6px 0 0; font-size: 17px; color: var(--text); }
    .panel--sand { background: var(--field); color: var(--field-ink); border: 0; border-left: 3px solid var(--ember); }
    .panel--sand .panel__head { border-bottom: 1px solid rgba(28, 22, 16, .2); padding: 16px 20px 12px; }
    .panel--sand .panel__head h2 { font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #522b0a; }
    .panel--sand .panel__body { padding: 16px 20px 18px; }
    .panel--sand .hint { color: #5a4632; }
    .panel--sand .kv dt { color: #5a4632; }
    .panel--sand .kv dd { font-size: 16px; }
    .panel--sand a { color: var(--sand-ember); }
    .panel--sand .timeline small { color: #5a4632; }
    .panel--sand .table-wrap--sand { border-left: 0; }
    .panel--sand .money .total { background: var(--field-ink); color: var(--field); padding: 14px 14px; margin: 8px -6px 0; }
    .panel--sand .money .due { color: var(--ember-hi); font-size: 22px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; margin: 0; }
    .kv dt { color: var(--muted); font-size: 14px; }
    .kv dd { margin: 0; }
    .money { display: grid; gap: 8px; }
    .money div { display: flex; justify-content: space-between; gap: 12px; }
    .money .total { background: var(--field); color: var(--field-ink); padding: 10px 12px; margin-top: 6px; font-weight: 500; align-items: baseline; }
    .money .due { color: var(--sand-ember); font-weight: 600; font-size: 17px; }
    .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    .timeline li { display: grid; grid-template-columns: 12px 1fr; gap: 12px; }
    .timeline li::before { content: ''; width: 9px; height: 9px; border-radius: 0; margin-top: 6px; background: var(--ember); }
    .timeline small { display: block; color: var(--dim); font-size: 13px; }
    .actions { display: grid; gap: 10px; }
    /* A warning is an alert, so it's dark (inside a sand list it's a dark band) */
    .flag { display: inline-block; margin-top: 8px; padding: 7px 12px; background: var(--field-ink); color: var(--text); border-left: 3px solid var(--ember); font-size: 13.5px; }

    /* ── Calendar ─────────────────────────────────────────────────────────── */
    .cal-wrap { overflow-x: auto; }
    .cal { border-collapse: separate; border-spacing: 0; min-width: 100%; }
    .cal th, .cal td { border-bottom: 1px solid var(--line); padding: 0; text-align: center; }
    .cal thead th { padding: 10px 4px; font-size: 12px; text-transform: none; letter-spacing: 0; }
    .cal thead th b { display: block; font-size: 15px; color: var(--text); font-weight: 500; }
    .cal thead th.weekend { background: rgba(255, 255, 255, .02); }
    /* After .weekend on purpose: today can be a Saturday or Sunday, and sand must win */
    .cal thead th.today { background: var(--field); color: var(--field-ink); }
    .cal thead th.today b { color: var(--field-ink); }
    .cal .season-row th { padding: 6px 4px; font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; border-bottom: 0; text-align: left; }
    .cal .season-row th.season { background: rgba(200, 120, 42, .10); color: var(--ember-hi); border-left: 1px solid var(--line-2); }
    .cal .room { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; padding: 12px 16px; min-width: 190px; border-right: 1px solid var(--line); }
    .cal .room b { display: block; font-weight: 500; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; }
    .cal .room span { color: var(--dim); font-size: 12.5px; text-transform: none; letter-spacing: 0; font-weight: 400; }
    .cell { display: grid; place-items: center; min-width: 52px; height: 58px; margin: 3px; border-radius: 0; font-size: 13.5px; font-variant-numeric: tabular-nums; cursor: pointer; border: 1px solid transparent; background: none; width: calc(100% - 6px); color: var(--text); }
    .cell:hover { border-color: var(--line-2); }
    .cell small { display: block; font-size: 11px; color: var(--dim); }
    /* fullness: more booked = more ember */
    .cell[data-level="0"] { background: rgba(255, 255, 255, .025); }
    .cell[data-level="1"] { background: rgba(200, 120, 42, .12); }
    .cell[data-level="2"] { background: rgba(200, 120, 42, .26); }
    .cell[data-level="3"] { background: rgba(200, 120, 42, .45); }
    .cell[data-level="full"] { background: var(--ember); color: #120c06; }
    .cell[data-level="full"] small { color: #3a2410; }
    .cell.closed { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 4px, transparent 4px 9px); }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 14px 18px; border-top: 1px solid var(--line); }
    .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 0; vertical-align: -2px; margin-right: 6px; }

    /* Calendar on sand: the same meaning, re-coloured for paper. Free = lighter paper; more
       booked = more ember; full = solid ember. Today, highlighted in sand on the dark page,
       inverts to a dark column here (sand on sand would vanish). */
    .panel--sand .cal th, .panel--sand .cal td { border-bottom-color: rgba(28, 22, 16, .14); }
    .panel--sand .cal thead th { color: #5a4632; }
    .panel--sand .cal thead th b { color: var(--field-ink); font-size: 16px; }
    .panel--sand .cal thead th.weekend { background: rgba(28, 22, 16, .05); }
    .panel--sand .cal thead th.today { background: var(--field-ink); color: var(--field); }
    .panel--sand .cal thead th.today b { color: var(--ember-hi); }
    .panel--sand .cal .season-row th { color: #522b0a; font-weight: 600; letter-spacing: .18em; }
    .panel--sand .cal .season-row th.season { background: rgba(200, 120, 42, .22); color: #7a3a0c; border-left-color: rgba(28, 22, 16, .2); }
    .panel--sand .cal .room { background: var(--field); border-right-color: rgba(28, 22, 16, .16); }
    .panel--sand .cal .room b { color: var(--field-ink); font-size: 15px; }
    .panel--sand .cal .room span { color: #5a4632; }
    .panel--sand .cell { color: var(--field-ink); font-weight: 500; }
    .panel--sand .cell small { color: #5a4632; font-weight: 400; }
    .panel--sand .cell:hover { border-color: rgba(28, 22, 16, .45); }
    .panel--sand .cell[data-level="0"], .sw[data-level="0"] { background-color: rgba(255, 255, 255, .38); }
    .panel--sand .cell[data-level="1"], .sw[data-level="1"] { background-color: rgba(200, 120, 42, .16); }
    .panel--sand .cell[data-level="2"], .sw[data-level="2"] { background-color: rgba(200, 120, 42, .30); }
    .panel--sand .cell[data-level="3"], .sw[data-level="3"] { background-color: rgba(200, 120, 42, .50); }
    .panel--sand .cell[data-level="full"], .sw[data-level="full"] { background-color: var(--ember); color: #120c06; }
    .panel--sand .cell[data-level="full"] small { color: #3a2410; }
    .panel--sand .cell.closed, .sw.closed { background-image: repeating-linear-gradient(135deg, rgba(28, 22, 16, .16) 0 4px, transparent 4px 9px); }
    .sw--today { background: var(--field-ink); }
    .panel--sand .legend { color: #5a4632; border-top-color: rgba(28, 22, 16, .16); }
    .panel--sand .legend i { outline: 1px solid rgba(28, 22, 16, .2); outline-offset: -1px; }
    /* Who's staying (the night panel) */
    .panel--sand .row { border-top-color: rgba(28, 22, 16, .14); }
    .panel--sand .row__name a { color: var(--field-ink); }
    .panel--sand .row__name a:hover { color: var(--sand-ember); }
    .panel--sand .row__meta, .panel--sand .empty { color: #5a4632; }

    /* ── Rooms & rates ────────────────────────────────────────────────────── */
    .room-card { display: grid; gap: 14px; }
    .room-card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .room-card h3 { font-family: var(--serif); font-size: 20px; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .fact { background: var(--panel-2); border-radius: 0; padding: 10px 12px; }
    .fact span { display: block; font-size: 12.5px; color: var(--muted); }
    .fact b { font-weight: 500; font-size: 17px; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--ember); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; align-items: end; }
    /* The room cards are forms, so they stay dark with sand fields; their figures are data, so sand */
    .fact { background: var(--field); color: var(--field-ink); border-left: 3px solid var(--ember); }
    .fact span { color: #5a4632; }
    .fact b { font-weight: 600; }
    .table-wrap--sand td.up { color: var(--sand-ember); font-weight: 600; }
    .table-wrap--sand td.down { color: #1b5023; font-weight: 600; }

    /* ── Enquiries ────────────────────────────────────────────────────────── */
    .inbox { display: grid; grid-template-columns: 360px 1fr; min-height: 520px; }
    .inbox__list { border-right: 1px solid var(--line); list-style: none; margin: 0; padding: 0; overflow-y: auto; }
    .inbox__item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; cursor: pointer; color: inherit; }
    .inbox__item:hover { background: var(--panel-2); }
    .inbox__item[aria-current="true"] { background: var(--panel-3); box-shadow: inset 2px 0 0 var(--ember); }
    .inbox__top { display: flex; justify-content: space-between; gap: 10px; }
    .inbox__item b { font-weight: 500; }
    /* Unread: a round dot, like the other notifications (Today's counts), not a square */
    .inbox__item.unread b::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ember-hi); margin-right: 8px; vertical-align: 1px; }
    .inbox__item small { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
    .inbox__item p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inbox__read { padding: 24px 28px; }
    .inbox__read h2 { font-family: var(--serif); font-size: 22px; margin-bottom: 4px; }
    .inbox__from { margin: 0; color: var(--muted); }
    /* The inbox on sand */
    .panel--sand .inbox__list { border-right-color: rgba(28, 22, 16, .16); }
    .panel--sand .inbox__item { border-bottom-color: rgba(28, 22, 16, .14); }
    .panel--sand .inbox__item:hover { background: rgba(28, 22, 16, .06); }
    .panel--sand .inbox__item[aria-current="true"] { background: rgba(28, 22, 16, .11); box-shadow: inset 3px 0 0 var(--ember); }
    .panel--sand .inbox__item b { color: var(--field-ink); }
    .panel--sand .inbox__item.unread b { font-weight: 700; }
    .panel--sand .inbox__item.unread b::before { background: var(--ember); }
    .panel--sand .inbox__item small, .panel--sand .inbox__item p, .panel--sand .inbox__from { color: #5a4632; }
    .panel--sand .inbox__read h2 { color: var(--field-ink); font-size: 26px; }
    .panel--sand .message { color: var(--field-ink); font-size: 16px; }
    .message { white-space: pre-wrap; line-height: 1.7; margin: 20px 0; max-width: 640px; }

    /* ── Dialog and toast ─────────────────────────────────────────────────── */
    dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line-2); border-radius: 0; padding: 0; width: min(460px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgba(0, 0, 0, .65); }
    .dlg { padding: 24px; display: grid; gap: 16px; }
    .dlg h2 { font-family: var(--serif); font-size: 22px; }
    .dlg p { margin: 0; color: var(--muted); }
    .dlg__actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel-3); border: 1px solid var(--line-2);
             padding: 12px 18px; border-radius: 0; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100vw - 32px); z-index: 50; }
    .toast[hidden] { display: none; }

    /* ==========================================================================
       RESPONSIVE: desktop first; tablets lose columns; phones get a drawer and cards
    ========================================================================== */
    @media (max-width: 1180px) {
      .detail { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 40; transform: translateX(-100%); transition: transform .25s ease; }
      .shell.nav-open .side { transform: none; box-shadow: 0 0 60px rgba(0,0,0,.7); }
      .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; }
      .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; padding: 10px 14px;
                background: var(--panel); border-bottom: 1px solid var(--line); }
      .topbar img { width: 28px; height: 28px; }
      .topbar b { font-family: var(--serif); font-weight: 400; font-size: 15px; text-transform: uppercase; letter-spacing: .14em; color: var(--ember); }
      .burger { background: none; border: 1px solid var(--line-2); border-radius: 0; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; }
      .burger svg { width: 20px; height: 20px; stroke: var(--text); }
      .page { padding: 22px 16px 56px; }
      .page__title { font-size: 25px; }
      .page__head--today .page__title { font-size: 36px; }
      .page__head--today .page__sub { font-size: 18px; }
      .page__head--big .page__title { font-size: 34px; }
      .page__head--big .page__sub { font-size: 16px; }
      .stats { gap: 16px 28px; }
      .stat__n { font-size: 38px; }
      .notice__n { width: 52px; height: 52px; font-size: 24px; }
      .notice__k { font-size: 13px; }
      .sheet { padding: 14px 16px 6px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .inbox { grid-template-columns: 1fr; }
      .inbox__list { border-right: 0; max-height: none; }
      .inbox.reading .inbox__list { display: none; }
      .inbox:not(.reading) .inbox__read { display: none; }
      .inbox__read { padding: 18px; }
    }
    @media (min-width: 901px) { .back-to-list { display: none; } }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
      .kv { grid-template-columns: 1fr; gap: 2px 0; }
      .kv dd { margin-bottom: 10px; }
      .facts { grid-template-columns: 1fr 1fr 1fr; }
      /* Bookings table becomes a list of cards: each cell shows its column name from data-label */
      .table--cards thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .table--cards tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
      .table-wrap--sand .table--cards tbody tr { border-bottom-color: rgba(28, 22, 16, .14); }
      .table-wrap--sand .table--cards td[data-label]::before { color: #5a4632; }
      .table--cards td { border: 0; padding: 0; }
      .table--cards td[data-label]::before { content: attr(data-label) ' · '; color: var(--dim); font-size: 12.5px; }
      .table--cards td.c-ref { grid-column: 1; }
      .table--cards td.c-status { grid-column: 2; grid-row: 1; justify-self: end; }
      .table--cards td.c-guest, .table--cards td.c-stay, .table--cards td.c-money { grid-column: 1 / -1; }
      .table--cards td.c-hide, .table--cards .sub.c-hide { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .side { transition: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dlg"></dialog>

  <script>
  /* ============================================================================================
     SAFARI EMBER ADMIN · PROTOTYPE SCRIPT
     How it's built, so the backend can slot in later:
       DATA    sample records shaped exactly like the database tables in docs/BLUEPRINT.md
       RULES   the same booking rules as the API (nights, prices, what takes a unit)
       VIEWS   one function per screen; each returns HTML built ONLY through esc() for any value
               that came from a guest or staff member (see the warning on esc)
       ROUTER  the address after # decides the screen: #/today, #/bookings, #/booking/SE-…, …
     In Phase 5 the DATA block is replaced by fetch('/api/admin/…') calls; the views stay.
  ============================================================================================ */
  (function () {
    'use strict';

    /* ── Helpers ─────────────────────────────────────────────────────────────────────────── */

    // SECURITY: guest names, requests and enquiry messages are typed by the public. Putting them
    // into HTML unescaped would let someone "book" under a name that contains a script tag and
    // run code in the manager's browser (stored XSS). (Never write a closing script tag inside
    // this script, even in a comment: the browser would end the script right there.) Every value from data goes through esc() before it is
    // placed in a template. Numbers and our own labels don't need it, but it never hurts.
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    var KES = new Intl.NumberFormat('en-KE');
    function money(n) { return 'KES ' + KES.format(n); }

    // Dates are plain YYYY-MM-DD strings in Nairobi time, like the database `date` columns.
    // Doing the maths in UTC on those strings means no time zone can shift a day.
    function todayNairobi() {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Nairobi' }).format(new Date());
    }
    function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5); }
    function fmtDate(iso, opts) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', Object.assign({ day: 'numeric', month: 'short', timeZone: 'UTC' }, opts || {})); }
    function fmtLong(iso) { return fmtDate(iso, { weekday: 'long', day: 'numeric', month: 'long' }); }
    function fmtDateTime(ms) { return new Date(ms).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Nairobi' }); }
    function stayLabel(b) { return fmtDate(b.checkIn) + ' – ' + fmtDate(b.checkOut, { year: daysBetween(TODAY, b.checkOut) > 300 ? 'numeric' : undefined }); }
    function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

    var TODAY = todayNairobi();

    // LAUNCH SCOPE (docs/BLUEPRINT.md, "Launch scope"): the admin ships with Today, Bookings,
    // Calendar, Rooms & rates and Enquiries. Closures is designed and kept here, hidden until its
    // backend exists. Set to false to see the full design (e.g. for the case study).
    var LAUNCH = true;
    var LATER = ['closures'];
    var NOW = Date.now();

    /* ── DATA: sample records (replace with the API in Phase 5) ──────────────────────────── */

    var ROOM_TYPES = [
      { id: 1, slug: 'hearthside-room', name: 'Hearthside Room',     kind: 'Deluxe',       sleeps: 2, units: 12, baseRateKes: 28000,  active: true },
      { id: 2, slug: 'coalbed-suite',   name: 'The Coalbed Suite',   kind: 'Junior suite', sleeps: 3, units: 6,  baseRateKes: 45000,  active: true },
      { id: 3, slug: 'ember-penthouse', name: 'The Ember Penthouse', kind: 'Penthouse',    sleeps: 4, units: 1,  baseRateKes: 120000, active: true },
    ];
    function roomType(id) { return ROOM_TYPES.find(function (r) { return r.id === id; }); }

    // Seasons as in api/src/db/seed.js: a percentage of each room's base rate, rounded to 500
    var SEASONS = [];
    (function () {
      var y = Number(TODAY.slice(0, 4)), id = 1;
      var defs = [['Long rains', '04-01', '06-01', 85], ['Migration season', '07-01', '11-01', 125], ['Festive season', '12-20', '01-04', 135]];
      [y - 1, y, y + 1].forEach(function (yr) {
        defs.forEach(function (d) {
          ROOM_TYPES.forEach(function (rt) {
            SEASONS.push({ id: id++, roomTypeId: rt.id, label: d[0], startsOn: yr + '-' + d[1],
              endsOn: d[2] < d[1] ? (yr + 1) + '-' + d[2] : yr + '-' + d[2],
              nightlyRateKes: Math.round(rt.baseRateKes * d[3] / 100 / 500) * 500 });
          });
        });
      });
    })();
    function rateFor(rtId, night) {
      var s = SEASONS.find(function (s) { return s.roomTypeId === rtId && s.startsOn <= night && night < s.endsOn; });
      return s ? s.nightlyRateKes : roomType(rtId).baseRateKes;
    }

    // Booking references: no 0/O or 1/I, as in the API
    var REF_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', refSeed = 7;
    function nextRef() { var r = 'SE-'; for (var i = 0; i < 6; i++) { refSeed = (refSeed * 9301 + 49297) % 233280; r += REF_ABC[refSeed % REF_ABC.length]; } return r; }

    // [first, last, room, check-in offset from today, nights, guests, status, extras]
    var GUESTS = [
      ['Amani', 'Wanjiru', 1, 0, 3, 2, 'CONFIRMED', { requests: 'Arriving late, around 9pm. Please keep dinner.' }],
      ['James', 'Thornton', 2, 0, 4, 3, 'CONFIRMED', {}],
      ['Fatima', 'Al-Sayed', 3, 0, 2, 2, 'CONFIRMED', { requests: 'Anniversary: a bottle of champagne in the room if possible.' }],
      ['David', 'Mwangi', 1, -3, 3, 2, 'INHOUSE', {}],
      ['Claire', 'Dubois', 1, -2, 2, 1, 'INHOUSE', {}],
      ['Kofi', 'Mensah', 2, -1, 5, 2, 'INHOUSE', { requests: 'Vegetarian meals for both guests.' }],
      ['Priya', 'Nair', 1, -1, 4, 2, 'INHOUSE', {}],
      ['Lena', 'Hoffmann', 1, -4, 4, 2, 'INHOUSE', {}],
      ['Samuel', 'Otieno', 2, -2, 2, 3, 'INHOUSE', {}],
      ['Grace', 'Achieng', 1, 0, 2, 2, 'HELD', { holdMin: 6 }],
      ['Tom', 'Becker', 2, 3, 3, 2, 'HELD', { holdMin: 11 }],
      ['Aisha', 'Bello', 1, 1, 3, 2, 'CONFIRMED', {}],
      ['Marco', 'Rossi', 2, 2, 4, 3, 'CONFIRMED', {}],
      ['Wanjiku', 'Kamau', 1, 2, 2, 1, 'CONFIRMED', {}],
      ['Olivia', 'Brown', 3, 5, 3, 4, 'CONFIRMED', { requests: 'Travelling with two children (8 and 11).' }],
      ['Hiroshi', 'Tanaka', 1, 6, 5, 2, 'CONFIRMED', {}],
      ['Nia', 'Kariuki', 2, 8, 2, 2, 'CONFIRMED', {}],
      ['Ethan', 'Cole', 1, 12, 3, 2, 'CONFIRMED', {}],
      ['Sofia', 'Garcia', 1, 4, 3, 2, 'CANCELLED', { reason: 'Guest changed travel plans' }],
      ['Brian', 'Kiprop', 1, 2, 2, 2, 'EXPIRED', {}],
      ['Elena', 'Petrova', 2, 9, 3, 2, 'EXPIRED', {}],
      ['Mark', 'Ellis', 1, -9, 3, 2, 'COMPLETED', {}],
      ['Zawadi', 'Njeri', 2, -12, 4, 3, 'COMPLETED', {}],
      ['Ahmed', 'Hassan', 3, -15, 2, 2, 'COMPLETED', {}],
    ];
    var BOOKINGS = GUESTS.map(function (g, i) {
      var checkIn = addDays(TODAY, g[3]), checkOut = addDays(checkIn, g[4]);
      var nights = []; for (var d = 0; d < g[4]; d++) { var n = addDays(checkIn, d); nights.push({ night: n, rateKes: rateFor(g[2], n) }); }
      var total = nights.reduce(function (s, n) { return s + n.rateKes; }, 0);
      var deposit = Math.ceil(total * 0.30);

            '<section class="panel panel--sand"><div class="panel__head"><h2>Guest</h2></div><div class="panel__body"><dl class="kv">' +
              '<dt>Name</dt><dd>' + guestName(b) + '</dd>' +
              '<dt>Email</dt><dd><a href="mailto:' + esc(b.email) + '">' + esc(b.email) + '</a></dd>' +
              '<dt>Phone</dt><dd><a href="tel:' + esc(b.phone.replace(/\s/g, '')) + '">' + esc(b.phone) + '</a></dd>' +
            '</dl></div></section>' +
            '<section class="panel panel--sand"><div class="panel__head"><h2>Price, night by night</h2><p class="hint">Frozen when the guest booked</p></div>' +
              '<div class="table-wrap table-wrap--sand"><table><thead><tr><th scope="col">Night</th><th scope="col" class="right">Rate</th></tr></thead><tbody>' +
              b.nightly.map(function (n) { return '<tr><td>' + fmtDate(n.night, { weekday: 'short' }) + '</td><td class="right num">' + money(n.rateKes) + '</td></tr>'; }).join('') +
              '</tbody></table></div></section>' +
          '</div>' +
          '<div class="stack">' +
            '<section class="panel panel--sand"><div class="panel__head"><h2>Payment</h2></div><div class="panel__body money num">' +
              '<div><span>Total</span><span>' + money(b.totalKes) + '</span></div>' +
              '<div><span>Deposit (30%)</span><span>' + money(b.depositKes) + '</span></div>' +
              b.payments.map(function (p) { return '<div class="hint"><span>' + esc(p.provider) + ' · ' + esc(p.ref) + '</span><span>− ' + money(p.amountKes) + '</span></div>'; }).join('') +
              '<div class="total"><span>' + (st === 'CANCELLED' || st === 'EXPIRED' ? 'Balance' : 'Balance due at the lodge') + '</span><span class="due">' + (st === 'CANCELLED' || st === 'EXPIRED' ? '—' : money(bal)) + '</span></div>' +
            '</div></section>' +
            '<section class="panel panel--sand"><div class="panel__head"><h2>History</h2></div><div class="panel__body"><ol class="timeline">' +
              events.sort(function (a, c) { return a[1] - c[1]; }).map(function (e) { return '<li><div>' + esc(e[0]) + '<small>' + fmtDateTime(e[1]) + '</small></div></li>'; }).join('') +
            '</ol></div></section>' +
            '<section class="panel panel--actions"><div class="panel__head"><h2>Actions</h2></div><div class="panel__body actions">' +
              // Guest emails wait for a domain (Launch scope), so there's nothing to resend yet
              (LAUNCH ? '' : '<button class="btn" data-act="resend" data-ref="' + b.ref + '"' + (b.payments.length ? '' : ' disabled') + '>Resend confirmation email</button>') +
              '<button class="btn" data-act="copylink" data-ref="' + b.ref + '">Copy the guest\'s booking link</button>' +
              (canCancel ? '<button class="btn btn--danger" data-act="cancel" data-ref="' + b.ref + '">Cancel booking</button>' : '') +
            '</div></section>' +
          '</div>' +
        '</div>';
    }

    /* Calendar: rooms free per night for three weeks. Rows = room types, columns = nights. */
    function viewCalendar() {
      var DAYS = 21, start = S.calStart, nights = [];
      for (var i = 0; i < DAYS; i++) nights.push(addDays(start, i));
      // Season band above the dates (taken from the first room type; all types share season dates)
      var bands = [], cur = null;
      nights.forEach(function (n) {
        var s = SEASONS.find(function (x) { return x.roomTypeId === 1 && x.startsOn <= n && n < x.endsOn; });
        var label = s ? s.label : 'Standard rates';
        if (cur && cur.label === label) cur.span++; else { cur = { label: label, span: 1, season: !!s }; bands.push(cur); }
      });
      function level(o, rt) {
        var open = rt.units - o.closed; if (o.free === 0) return 'full';
        var r = 1 - o.free / Math.max(1, open); return r < .25 ? 0 : r < .5 ? 1 : r < .8 ? 2 : 3;
      }
      return '<div class="page__head page__head--big"><div><h1 class="page__title">Calendar</h1><p class="page__sub">Rooms free each night. Select a night to see who is staying.</p></div>' +
          '<div style="display:flex;gap:8px"><button class="btn" data-cal="-21" aria-label="Previous three weeks">←</button><button class="btn" data-cal="0">Today</button><button class="btn" data-cal="21" aria-label="Next three weeks">→</button></div></div>' +
        '<section class="panel panel--sand"><div class="cal-wrap"><table class="cal"><caption class="sr-only">Rooms free per night, ' + fmtDate(nights[0]) + ' to ' + fmtDate(nights[DAYS - 1]) + '</caption><thead>' +
          '<tr class="season-row"><th class="room" scope="col">Season</th>' + bands.map(function (b) { return '<th colspan="' + b.span + '" class="' + (b.season ? 'season' : '') + '">' + esc(b.label) + '</th>'; }).join('') + '</tr>' +
          '<tr><th class="room" scope="col">Room type</th>' + nights.map(function (n) {
            var d = new Date(n + 'T12:00:00Z'), dow = d.getUTCDay();
            return '<th scope="col" class="' + (n === TODAY ? 'today ' : '') + (dow === 0 || dow === 6 ? 'weekend' : '') + '">' + d.toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' }) + '<b>' + d.getUTCDate() + '</b></th>';
          }).join('') + '</tr></thead><tbody>' +
          ROOM_TYPES.map(function (rt) {
            return '<tr><th class="room" scope="row"><b>' + esc(rt.name) + '</b><span>' + plural(rt.units, 'unit') + '</span></th>' + nights.map(function (n) {
              var o = occupancy(rt, n);
              var label = rt.name + ', ' + fmtLong(n) + ': ' + o.free + ' of ' + rt.units + ' free' + (o.closed ? ', ' + o.closed + ' closed' : '');
              return '<td><button class="cell' + (o.closed ? ' closed' : '') + '" data-level="' + level(o, rt) + '" data-night="' + n + '" data-room="' + rt.id + '" aria-label="' + esc(label) + '">' +
                o.free + '<small>free</small></button></td>';
            }).join('') + '</tr>';
          }).join('') +
        '</tbody></table></div>' +
        // Legend swatches use the same classes as the cells, so they can never drift apart
        '<div class="legend"><span><i class="sw" data-level="0"></i>Mostly free</span><span><i class="sw" data-level="2"></i>Filling up</span>' +
          '<span><i class="sw" data-level="3"></i>Nearly full</span><span><i class="sw" data-level="full"></i>Full</span>' +
          '<span><i class="sw closed"></i>Some rooms closed</span><span><i class="sw sw--today"></i>Today</span></div></section>' +
        '<section class="panel panel--sand" style="margin-top:20px" id="night-panel" aria-live="polite"><div class="panel__head"><h2>Select a night above</h2></div><p class="empty">The guests staying that night will show here.</p></section>';
    }
    function nightPanel(night, rtId) {
      var rt = roomType(rtId), o = occupancy(rt, night);
      var list = BOOKINGS.filter(function (b) { return b.roomTypeId === rtId && takesUnit(b, night); });
      var cl = CLOSURES.filter(function (c) { return (c.roomTypeId === null || c.roomTypeId === rtId) && c.startsOn <= night && night < c.endsOn; });
      return '<div class="panel__head"><h2>' + esc(rt.name) + ' · ' + fmtLong(night) + '</h2><p class="hint">' + o.free + ' of ' + rt.units + ' free</p></div>' +
        (list.length || cl.length ? '<ul class="rows">' + list.map(function (b) {
          return '<li class="row"><div><div class="row__name"><a href="#/booking/' + b.ref + '">' + guestName(b) + '</a> ' + chip(shownStatus(b)) + '</div><div class="row__meta">' + stayLabel(b) + ' · <span class="ref">' + b.ref + '</span></div></div></li>';
        }).join('') + cl.map(function (c) {
          return '<li class="row"><div><div class="row__name">Closed: ' + esc(c.reason) + '</div><div class="row__meta">' + (c.units == null ? 'All units' : plural(c.units, 'unit')) + ' · ' + fmtDate(c.startsOn) + ' – ' + fmtDate(c.endsOn) + '</div></div></li>';
        }).join('') + '</ul>' : '<p class="empty">Nobody is staying in this room type that night.</p>');
    }

    /* Rooms & rates: base prices, units, on/off; seasonal prices below */
    function viewRooms() {
      var y = TODAY.slice(0, 4);
      var seasons = SEASONS.filter(function (s) { return s.endsOn > TODAY; }).sort(function (a, b) { return a.startsOn < b.startsOn ? -1 : a.startsOn > b.startsOn ? 1 : a.roomTypeId - b.roomTypeId; });
      return '<div class="page__head page__head--big"><div><h1 class="page__title">Rooms &amp; rates</h1><p class="page__sub">Changes apply to new bookings only. Guests who have already booked keep the price they were shown.</p></div></div>' +
        '<div class="grid-3">' + ROOM_TYPES.map(function (rt) {
          return '<section class="panel"><form class="panel__body room-card" data-room-form="' + rt.id + '">' +
            '<div class="room-card__top"><div><h3>' + esc(rt.name) + '</h3><span class="hint">' + esc(rt.kind) + '</span></div>' +
              '<label class="toggle"><input type="checkbox" name="active"' + (rt.active ? ' checked' : '') + ' /> Bookable</label></div>' +
            '<div class="facts"><div class="fact"><span>Sleeps</span><b class="num">' + rt.sleeps + '</b></div><div class="fact"><span>Units</span><b class="num">' + rt.units + '</b></div>' +
              '<div class="fact"><span>Tonight</span><b class="num">' + occupancy(rt, TODAY).free + ' free</b></div></div>' +
            '<div class="form-grid">' +
              '<div class="field"><label for="base-' + rt.id + '">Base rate (KES / night)</label><input class="input num" id="base-' + rt.id + '" name="base" inputmode="numeric" value="' + rt.baseRateKes + '" /></div>' +
              '<div class="field"><label for="units-' + rt.id + '">Units</label><input class="input num" id="units-' + rt.id + '" name="units" type="number" min="0" max="99" value="' + rt.units + '" /></div>' +
            '</div><button class="btn btn--primary">Save changes</button></form></section>';
        }).join('') + '</div>' +
        '<section class="panel" style="margin-top:20px"><div class="panel__head"><h2>Seasonal rates</h2><p class="hint">A season replaces the base rate for the nights it covers</p></div>' +
          '<div class="table-wrap table-wrap--sand"><table><thead><tr><th scope="col">Season</th><th scope="col">Room</th><th scope="col">From</th><th scope="col">Until (not included)</th><th scope="col" class="right">KES / night</th><th scope="col" class="right">vs base</th></tr></thead><tbody>' +
          seasons.slice(0, 12).map(function (s) {
            var rt = roomType(s.roomTypeId), diff = Math.round((s.nightlyRateKes / rt.baseRateKes - 1) * 100);
            var on = s.startsOn <= TODAY && TODAY < s.endsOn;
            return '<tr><td>' + esc(s.label) + (on ? ' <span class="chip chip--CONFIRMED">Now</span>' : '') + '</td><td>' + esc(rt.name) + '</td><td class="num">' + fmtDate(s.startsOn, { year: 'numeric' }) + '</td><td class="num">' + fmtDate(s.endsOn, { year: 'numeric' }) + '</td>' +
              '<td class="right num">' + KES.format(s.nightlyRateKes) + '</td><td class="right num ' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '+' : '') + diff + '%</td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<div class="panel__body"><form class="form-grid" id="f-season">' +
            '<div class="field"><label for="s-label">New season</label><input class="input" id="s-label" placeholder="e.g. Easter" required /></div>' +
            '<div class="field"><label for="s-room">Room</label><select class="input" id="s-room">' + ROOM_TYPES.map(function (rt) { return '<option value="' + rt.id + '">' + esc(rt.name) + '</option>'; }).join('') + '</select></div>' +
            '<div class="field"><label for="s-from">From</label><input class="input" id="s-from" type="date" required /></div>' +
            '<div class="field"><label for="s-to">Until</label><input class="input" id="s-to" type="date" required /></div>' +
            '<div class="field"><label for="s-rate">KES / night</label><input class="input num" id="s-rate" inputmode="numeric" required /></div>' +
            '<button class="btn">Add season</button></form></div></section>';
    }

    /* Closures: take units out of sale (maintenance, private events) */
    function viewClosures() {
      var list = CLOSURES.slice().sort(function (a, b) { return a.startsOn < b.startsOn ? -1 : 1; });
      return '<div class="page__head page__head--big"><div><h1 class="page__title">Closures</h1><p class="page__sub">Closed rooms can\'t be booked online. Closing never cancels existing bookings.</p></div></div>' +
        '<div class="detail">' +
          '<section class="panel panel--sand"><div class="panel__head"><h2>Upcoming closures</h2></div>' +
            (list.length ? '<ul class="rows">' + list.map(function (c) {
              var rt = c.roomTypeId ? roomType(c.roomTypeId) : null;
              var clash = BOOKINGS.filter(function (b) { return (!rt || b.roomTypeId === rt.id) && (b.status === 'CONFIRMED') && b.checkIn < c.endsOn && c.startsOn < b.checkOut; }).length;
              return '<li class="row"><div><div class="row__name">' + esc(c.reason) + '</div>' +
                '<div class="row__meta">' + (rt ? esc(rt.name) : 'Whole lodge') + ' · ' + (c.units == null ? 'all units' : plural(c.units, 'unit')) + ' · ' + fmtDate(c.startsOn) + ' – ' + fmtDate(c.endsOn) + ' (' + plural(daysBetween(c.startsOn, c.endsOn), 'night') + ')</div>' +
                (clash ? '<div class="flag">⚠ ' + plural(clash, 'confirmed booking') + ' overlap these dates. They stay booked: contact the guests if needed.</div>' : '') +
                '</div><div class="row__actions"><button class="btn btn--small btn--danger" data-act="reopen" data-id="' + c.id + '">Reopen</button></div></li>';
            }).join('') + '</ul>' : '<p class="empty">Nothing is closed.</p>') + '</section>' +
          '<section class="panel"><div class="panel__head"><h2>Close rooms</h2></div><form class="panel__body stack" id="f-closure" style="gap:14px">' +
            '<div class="field"><label for="c-room">Which rooms</label><select class="input" id="c-room"><option value="">Whole lodge</option>' + ROOM_TYPES.map(function (rt) { return '<option value="' + rt.id + '">' + esc(rt.name) + '</option>'; }).join('') + '</select></div>' +
            '<div class="grid-2" style="gap:14px"><div class="field"><label for="c-from">First night</label><input class="input" id="c-from" type="date" required min="' + TODAY + '" /></div>' +
              '<div class="field"><label for="c-to">Open again on</label><input class="input" id="c-to" type="date" required min="' + addDays(TODAY, 1) + '" /></div></div>' +
            '<div class="field"><label for="c-units">How many units</label><input class="input num" id="c-units" type="number" min="1" placeholder="All" /><span class="hint">Leave empty to close every unit.</span></div>' +
            '<div class="field"><label for="c-reason">Reason (staff only)</label><input class="input" id="c-reason" maxlength="120" required placeholder="e.g. Painting, suites 1–2" /></div>' +
            '<button class="btn btn--primary">Close these dates</button></form></section>' +
        '</div>';
    }

    /* Enquiries: the "Get in touch" form's inbox */
    function viewEnquiries() {
      var list = ENQUIRIES.slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
      var cur = ENQUIRIES.find(function (e) { return e.id === S.enquiry; }) || list[0];
      function ago(ms) { var h = Math.round((Date.now() - ms) / 36e5); return h < 1 ? 'Just now' : h < 24 ? h + ' h ago' : fmtDateTime(ms).split(',')[0]; }
      return '<div class="page__head page__head--big"><div><h1 class="page__title">Enquiries</h1><p class="page__sub">Messages from the website\'s "Get in touch" form.</p></div></div>' +
        '<section class="panel panel--sand inbox' + (S.reading ? ' reading' : '') + '" id="inbox"><ul class="inbox__list" aria-label="Enquiries">' + list.map(function (e) {
          return '<li><button class="inbox__item' + (e.status === 'NEW' ? ' unread' : '') + '" data-enq="' + e.id + '" aria-current="' + (cur && e.id === cur.id) + '">' +
            '<div class="inbox__top"><b>' + esc(e.firstName + ' ' + e.lastName) + '</b><small>' + ago(e.createdAt) + '</small></div>' +
            '<p>' + esc(e.subject) + ' · ' + esc(e.message) + '</p></button></li>';
        }).join('') + '</ul>' +
        (cur ? '<article class="inbox__read" aria-live="polite">' +
          '<button class="btn btn--small btn--ghost back-to-list" data-back="1" style="padding:0;margin-bottom:12px">← All enquiries</button>' +
          '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2>' + esc(cur.subject) + '</h2>' +
            '<p class="inbox__from">' + esc(cur.firstName + ' ' + cur.lastName) + ' · ' + fmtDateTime(cur.createdAt) + '</p></div><div>' + chip(cur.status) + '</div></div>' +
          '<dl class="kv" style="margin-top:20px">' +
            '<dt>Email</dt><dd><a href="mailto:' + esc(cur.email) + '">' + esc(cur.email) + '</a></dd>' +
            (cur.phone ? '<dt>Phone</dt><dd><a href="tel:' + esc(cur.phone.replace(/\s/g, '')) + '">' + esc(cur.phone) + '</a></dd>' : '') +
            (cur.checkIn ? '<dt>Dates</dt><dd>' + fmtDate(cur.checkIn) + ' – ' + fmtDate(cur.checkOut) + ' (' + plural(daysBetween(cur.checkIn, cur.checkOut), 'night') + ')</dd>' : '') +
            (cur.guests ? '<dt>Guests</dt><dd>' + cur.guests + '</dd>' : '') +
          '</dl>' +
          '<div class="message">' + esc(cur.message) + '</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            '<a class="btn btn--primary btn--caps" href="mailto:' + esc(cur.email) + '?subject=' + encodeURIComponent('Re: ' + cur.subject + ' · Safari Ember') + '" aria-label="Reply by email">Reply</a>' +
            (cur.status === 'NEW' ? '<button class="btn btn--caps" data-act="handled" data-id="' + cur.id + '">Mark as handled</button>' : '<button class="btn btn--caps" data-act="reopen-enq" data-id="' + cur.id + '">Mark as new</button>') +
          '</div></article>' : '<p class="empty">No enquiries yet.</p>') + '</section>';
    }

    /* ── ROUTER ───────────────────────────────────────────────────────────────────────────── */

    var app = document.getElementById('app');
    var holdTick;
    function render() {
      var hash = location.hash.replace(/^#\/?/, '') || 'today';
      var parts = hash.split('/');
      if (!S.signedIn && parts[0] !== 'login') { location.replace('#/login'); return; }
      if (S.signedIn && parts[0] === 'login') { location.replace('#/today'); return; }
      if (LAUNCH && LATER.indexOf(parts[0]) > -1) { location.replace('#/today'); return; }   // not built yet: back to Today
      clearInterval(holdTick);

      var titleMap = { today: 'Today', bookings: 'Bookings', booking: 'Booking', calendar: 'Calendar', rooms: 'Rooms & rates', closures: 'Closures', enquiries: 'Enquiries', login: 'Sign in' };
      document.title = (titleMap[parts[0]] || 'Admin') + ' · Safari Ember Admin';

      if (parts[0] === 'login') { app.innerHTML = viewLogin(); bindLogin(); return; }
      var views = { today: viewToday, bookings: viewBookings, calendar: viewCalendar, rooms: viewRooms, closures: viewClosures, enquiries: viewEnquiries };
      var active = parts[0] === 'booking' ? 'bookings' : parts[0];
      var html = parts[0] === 'booking' ? viewBooking(decodeURIComponent(parts[1] || '')) : (views[parts[0]] || viewToday)();
      var hadFocusInMain = false;
      app.innerHTML = shell(active, html);
      bindShell();
      // Move focus to the new page for keyboard and screen-reader users, like a page load would
      if (window.__routed) document.getElementById('main').focus({ preventScroll: true });
      window.__routed = true;
      window.scrollTo(0, 0);
      tickHolds(); holdTick = setInterval(tickHolds, 1000);
    }

    function tickHolds() {
      document.querySelectorAll('.timer[data-expires]').forEach(function (el) {
        var left = Math.max(0, Number(el.dataset.expires) - Date.now());
        var m = Math.floor(left / 6e4), s = Math.floor(left % 6e4 / 1000);
        el.textContent = left ? m + ':' + String(s).padStart(2, '0') + ' left' : 'Released';
      });
    }

    /* ── EVENTS ───────────────────────────────────────────────────────────────────────────── */

    function bindLogin() {
      var f = document.getElementById('f-login'), c = document.getElementById('f-code');
      if (f) { document.getElementById('email').focus();
        f.addEventListener('submit', function (e) { e.preventDefault(); S.stage = 'code'; render(); document.getElementById('code').focus(); }); }
      if (c) {
        c.addEventListener('submit', function (e) {
          e.preventDefault();
          var v = document.getElementById('code').value.trim();
          if (!/^\d{6}$/.test(v)) { toast('Enter the 6 digits from your authenticator app.'); return; }
          S.signedIn = true; S.stage = 'password';
          try { sessionStorage.setItem('se-admin-proto', '1'); } catch (err) {}
          location.hash = '#/today';
        });
        document.getElementById('restart').onclick = function () { S.stage = 'password'; render(); };
        document.getElementById('backup').onclick = function () { toast('Backup codes: 10 one-time codes given to each manager when they set up two-factor.'); };
      }
    }

    function bindShell() {
      var shellEl = document.getElementById('shell'), burger = document.getElementById('burger');
      function setNav(open) {
        shellEl.classList.toggle('nav-open', open); burger.setAttribute('aria-expanded', open);
        var scrim = document.querySelector('.scrim');
        if (open && !scrim) { scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.onclick = function () { setNav(false); }; shellEl.appendChild(scrim); }
        if (!open && scrim) scrim.remove();
        if (open) document.querySelector('.nav a').focus();
      }
      burger.onclick = function () { setNav(!shellEl.classList.contains('nav-open')); };
      // Esc closes the phone menu. Assigned (not added), so re-rendering never stacks up listeners.
      document.onkeydown = function (e) { if (e.key === 'Escape' && shellEl.classList.contains('nav-open')) { setNav(false); burger.focus(); } };
      document.getElementById('signout').onclick = function () {
        S.signedIn = false; try { sessionStorage.removeItem('se-admin-proto'); } catch (e) {}
        location.hash = '#/login';
      };

      // Bookings table: search, filters, whole-row click
      var q = document.getElementById('q');
      if (q) {
        q.addEventListener('input', function () { S.bookingsQ = q.value; document.getElementById('rows').innerHTML = bookingRowsHtml(); });
        document.getElementById('room').onchange = function (e) { S.bookingsRoom = e.target.value; document.getElementById('rows').innerHTML = bookingRowsHtml(); };
        document.querySelectorAll('[data-filter]').forEach(function (b) {
          b.onclick = function () { S.bookingsFilter = b.dataset.filter;
            document.querySelectorAll('[data-filter]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
            document.getElementById('rows').innerHTML = bookingRowsHtml(); };
        });
        document.getElementById('rows').addEventListener('click', function (e) {
          var tr = e.target.closest('tr[data-href]'); if (tr && !e.target.closest('a')) location.hash = tr.dataset.href;
        });
      }

      // Calendar
      document.querySelectorAll('[data-cal]').forEach(function (b) {
        b.onclick = function () { var n = Number(b.dataset.cal); S.calStart = n ? addDays(S.calStart, n) : TODAY; render(); };
      });
      document.querySelectorAll('.cell').forEach(function (c) {
        c.onclick = function () { document.getElementById('night-panel').innerHTML = nightPanel(c.dataset.night, Number(c.dataset.room)); };
      });

      // Enquiries
      document.querySelectorAll('[data-enq]').forEach(function (b) {
        b.onclick = function () { S.enquiry = Number(b.dataset.enq); S.reading = true; render(); };
      });
      var back = document.querySelector('[data-back]'); if (back) back.onclick = function () { S.reading = false; render(); };

      // Forms (prototype: they update the sample data in memory)
      document.querySelectorAll('[data-room-form]').forEach(function (f) {
        f.onsubmit = function (e) {
          e.preventDefault(); var rt = roomType(Number(f.dataset.roomForm));
          var base = Number(String(f.base.value).replace(/[^\d]/g, '')), units = Number(f.units.value);
          if (!(base >= 1000)) { toast('The base rate should be at least KES 1,000.'); f.base.focus(); return; }
          rt.baseRateKes = base; rt.units = units; rt.active = f.active.checked;
          toast(rt.name + ' saved (prototype: not stored).'); render();
        };
      });
      var fs = document.getElementById('f-season');
      if (fs) fs.onsubmit = function (e) {
        e.preventDefault();
        var from = document.getElementById('s-from').value, to = document.getElementById('s-to').value;
        if (to <= from) { toast('"Until" must be after "From".'); return; }
        SEASONS.push({ id: SEASONS.length + 1, roomTypeId: Number(document.getElementById('s-room').value), label: document.getElementById('s-label').value.trim(),
          startsOn: from, endsOn: to, nightlyRateKes: Number(document.getElementById('s-rate').value.replace(/[^\d]/g, '')) });
        toast('Season added (prototype: not stored).'); render();
      };
      var fc = document.getElementById('f-closure');
      if (fc) fc.onsubmit = function (e) {
        e.preventDefault();
        var from = document.getElementById('c-from').value, to = document.getElementById('c-to').value;
        if (!from || !to || to <= from) { toast('"Open again on" must be after the first night.'); return; }
        var u = document.getElementById('c-units').value;
        CLOSURES.push({ id: closureSeq++, roomTypeId: document.getElementById('c-room').value ? Number(document.getElementById('c-room').value) : null,
          startsOn: from, endsOn: to, units: u ? Number(u) : null, reason: document.getElementById('c-reason').value.trim() });
        toast('Dates closed (prototype: not stored).'); render();
      };

      // Buttons with data-act, anywhere on the page
      document.getElementById('main').addEventListener('click', function (e) {
        var b = e.target.closest('[data-act]'); if (!b) return;
        var bk = b.dataset.ref && byRef(b.dataset.ref);
        switch (b.dataset.act) {
          case 'showheld': S.bookingsFilter = 'held'; break;   // the link itself then opens #/bookings
          case 'checkin':
            bk.checkedInAt = Date.now(); toast(bk.firstName + ' ' + bk.lastName + ' checked in. Balance due ' + money(balance(bk)) + '.'); render(); break;
          case 'checkout':
            confirmDialog({ title: 'Check out ' + bk.firstName + ' ' + bk.lastName + '?', body: 'Make sure the balance of ' + money(balance(bk)) + ' has been paid at the desk.', ok: 'Check out',
              onOk: function () { bk.status = 'COMPLETED'; bk.checkedInAt = bk.checkedInAt || Date.now(); toast('Checked out. Room ready for housekeeping.'); render(); } }); break;
          case 'cancel':
            confirmDialog({ title: 'Cancel ' + bk.ref + '?', danger: true, ok: 'Cancel booking', field: 'Reason (the guest will see this in their email)',
              body: bk.payments.length ? 'The room is released straight away. The deposit of ' + money(bk.depositKes) + ' is not refunded automatically: refund it from M-Pesa or Paystack if your policy allows.' : 'The hold is released straight away. No payment was taken.',
              onOk: function (reason) { bk.status = 'CANCELLED'; bk.cancelledAt = Date.now(); bk.cancelReason = reason; toast(bk.ref + ' cancelled.'); render(); } }); break;
          case 'resend': toast('Confirmation email sent again to ' + bk.email + ' (prototype).'); break;
          case 'copylink':
            var link = location.origin + '/booking.html?ref=' + bk.ref + '&sig=…';
            (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(function () { toast('Guest link copied.'); }, function () { toast(link); }); break;
          case 'reopen':
            var c = CLOSURES.find(function (x) { return x.id === Number(b.dataset.id); });
            confirmDialog({ title: 'Reopen these dates?', body: c.reason + ': the rooms go back on sale immediately.', ok: 'Reopen',
              onOk: function () { CLOSURES.splice(CLOSURES.indexOf(c), 1); toast('Rooms back on sale.'); render(); } }); break;
          case 'handled': case 'reopen-enq':
            var en = ENQUIRIES.find(function (x) { return x.id === Number(b.dataset.id); });
            en.status = b.dataset.act === 'handled' ? 'HANDLED' : 'NEW'; render(); break;
        }
      });
    }

    window.addEventListener('hashchange', render);
    render();

    /* ── NOTES FOR THE BACKEND (Phase 5) ──────────────────────────────────────────────────────
       1. Check-in needs a column the Phase 1 schema doesn't have: bookings.checked_in_at
          (timestamp, null until the guest arrives). "In house" = CONFIRMED + checked_in_at set.
          Check-out sets status COMPLETED. Add both in the Phase 5 migration.
       2. Every /api/admin/* route must require a signed-in admin session (with two-factor done).
          This page's sign-in is only a design: it lets anyone in.
       3. Enquiries need status (NEW / HANDLED), already in the blueprint's table.
    ─────────────────────────────────────────────────────────────────────────────────────────── */
  })();
  </script>
</body>
</html>
